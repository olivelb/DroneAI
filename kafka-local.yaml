apiVersion: v1
kind: Namespace
metadata:
  name: kafka
---
apiVersion: v1
kind: Service
metadata:
  name: my-kafka
  namespace: kafka
spec:
  ports:
  - port: 9092
    name: plaintext
  selector:
    app: kafka
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-broker
  namespace: kafka
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: apache/kafka:3.7.0
        ports:
        - containerPort: 9092
        env:
        - name: KAFKA_NODE_ID
          value: "1"
        - name: KAFKA_PROCESS_ROLES
          value: "broker,controller"
        - name: KAFKA_LISTENERS
          value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://my-kafka.kafka.svc.cluster.local:9092"
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: "CONTROLLER"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: "1@localhost:9093"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: "1"
        - name: CLUSTER_ID
          value: "alteia-local-cluster-123"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: colmap-worker
  namespace: kafka
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: colmap
  template:
    metadata:
      labels:
        app: colmap
    spec:
      containers:
      - name: colmap
        image: drone-colmap:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: KAFKA_BROKER
          value: "my-kafka.kafka.svc.cluster.local:9092"
        - name: WORKSPACE_DIR
          value: "/mnt/j/workspace"
        - name: QT_QPA_PLATFORM
          value: "offscreen"
        volumeMounts:
        - name: host-root
          mountPath: /host
        resources:
          limits:
            nvidia.com/gpu: "1"
            memory: "80Gi"
          requests:
            memory: "80Gi"
      volumes:
      - name: host-root
        hostPath:
          path: /
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ia-worker
  namespace: kafka
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ia
  template:
    metadata:
      labels:
        app: ia
    spec:
      containers:
      - name: ia
        image: drone-ia:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: KAFKA_BROKER
          value: "my-kafka.kafka.svc.cluster.local:9092"
        volumeMounts:
        - name: host-root
          mountPath: /host
        resources:
          limits:
            nvidia.com/gpu: "1"
            memory: "8Gi"
          requests:
            memory: "2Gi"
      volumes:
      - name: host-root
        hostPath:
          path: /
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processing-worker
  namespace: kafka
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: processing
  template:
    metadata:
      labels:
        app: processing
    spec:
      containers:
      - name: processing
        image: drone-processing:latest
        resources:
          limits:
            memory: "4Gi"
          requests:
            memory: "1Gi"
        imagePullPolicy: IfNotPresent
        env:
        - name: KAFKA_BROKER
          value: "my-kafka.kafka.svc.cluster.local:9092"
        volumeMounts:
        - name: host-root
          mountPath: /host
      volumes:
      - name: host-root
        hostPath:
          path: /
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-api
  namespace: kafka
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dashboard-api
  template:
    metadata:
      labels:
        app: dashboard-api
    spec:
      serviceAccountName: dashboard-api-sa
      containers:
      - name: api
        image: drone-dashboard-api:latest
        resources:
          limits:
            memory: "2Gi"
          requests:
            memory: "512Mi"
        imagePullPolicy: IfNotPresent
        env:
        - name: KAFKA_BROKER
          value: "my-kafka.kafka.svc.cluster.local:9092"
        - name: WORKSPACE_DIR
          value: "/mnt/j/workspace"
        - name: INPUT_DIR
          value: "/host/mnt/j/workspace"
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: host-root
          mountPath: /host
      volumes:
      - name: host-root
        hostPath:
          path: /
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-api-service
  namespace: kafka
spec:
  type: NodePort
  selector:
    app: dashboard-api
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-frontend
  namespace: kafka
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dashboard-frontend
  template:
    metadata:
      labels:
        app: dashboard-frontend
    spec:
      containers:
      - name: frontend
        image: drone-dashboard-frontend:latest
        resources:
          limits:
            memory: "512Mi"
          requests:
            memory: "128Mi"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-frontend-service
  namespace: kafka
spec:
  type: NodePort
  selector:
    app: dashboard-frontend
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30000
