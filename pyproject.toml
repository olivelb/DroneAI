[project]
name = "droneai"
version = "0.1.0"
description = "Preproduction geospatial engineering platform for drone imagery"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["app1-colmap", "tests"]
addopts = "-ra --strict-markers --ignore=app1-colmap/colmap-local"
markers = [
    "gpu: requires CUDA and a compatible CuPy installation",
    "integration: requires external services such as Kafka, S3, or Postgres",
    "slow: long-running test",
]

[tool.coverage.run]
branch = true
relative_files = true
source = [
    "shared",
    "app1-colmap",
    "app2-ia",
    "app3-processing",
    "app4-dashboard/api",
    "tools",
]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "app1-colmap/ceres-solver/*",
    "app1-colmap/colmap-local/*",
]

[tool.coverage.report]
fail_under = 55
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    "app1-colmap/patches",
    "app1-colmap/ceres-solver",
    "app1-colmap/colmap-local",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.per-file-ignores]
"app1-colmap/test_*.py" = ["E402"]
"app1-colmap/gaussian_ortho/tests/*.py" = ["E402"]
