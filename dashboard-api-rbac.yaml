apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-api-sa
  namespace: kafka
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dashboard-api-pod-reader
  namespace: kafka
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-api-pod-reader-binding
  namespace: kafka
subjects:
- kind: ServiceAccount
  name: dashboard-api-sa
  namespace: kafka
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dashboard-api-pod-reader