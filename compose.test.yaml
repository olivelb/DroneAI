# Test dependencies and HTTP control plane only. Compute runs as Kubernetes Stage Jobs.
name: droneai-test

x-common-environment: &common-environment
  KAFKA_BROKER: kafka:9092
  CANCELLATION_POLL_SECONDS: "2"
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: http://${DRONEAI_ACCESS_HOST:-localhost}:${DRONEAI_MINIO_API_PORT:-30091}
  S3_BUCKET: drone-ai
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_REGION: us-east-1
  DATABASE_URL: postgresql://droneai:droneai-local@postgres:5432/droneai

x-worker-dependencies: &worker-dependencies
  kafka-init:
    condition: service_completed_successfully
  minio-init:
    condition: service_completed_successfully
  db-migrate:
    condition: service_completed_successfully

services:
  postgres:
    image: postgis/postgis:16-3.5@sha256:8828b03e9a95269f808abe62aa83215b22a2d3710f54a55e8040327b7b5f9932
    restart: unless-stopped
    environment:
      POSTGRES_DB: droneai
      POSTGRES_USER: droneai
      POSTGRES_PASSWORD: droneai-local
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U droneai -d droneai]
      interval: 5s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.7.0@sha256:41c20d65b0a2180b9deca056d47540771752e69fe9225d5748dd65a25a9675d7
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      CLUSTER_ID: droneai-local-cluster-001
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.7.0@sha256:41c20d65b0a2180b9deca056d47540771752e69fe9225d5748dd65a25a9675d7
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        for topic_spec in \
          pipeline-status:1 \
          pipeline-control:1 \
          pipeline-dead-letter:1
        do
          topic="$${topic_spec%%:*}"
          desired_partitions="$${topic_spec##*:}"
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:9092 \
            --create \
            --if-not-exists \
            --partitions "$${desired_partitions}" \
            --replication-factor 1 \
            --topic "$$topic"
          current_partitions="$$(
            /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server kafka:9092 \
              --describe \
              --topic "$$topic" | \
              awk '/PartitionCount:/ { for (field = 1; field <= NF; field++) if ($$field == "PartitionCount:") print $$(field + 1) }' | \
              head -n 1
          )"
          if [ -z "$${current_partitions}" ]; then
            echo "Unable to determine partition count for $$topic" >&2
            exit 1
          fi
          if [ "$${current_partitions}" -lt "$${desired_partitions}" ]; then
            /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server kafka:9092 \
              --alter \
              --topic "$$topic" \
              --partitions "$${desired_partitions}"
          fi
        done

  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # MinIO Community exposes CORS globally through this environment variable.
      MINIO_API_CORS_ALLOW_ORIGIN: "${DRONEAI_MINIO_CORS_ALLOW_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:30000,http://127.0.0.1:30000}"
    ports:
      - ${DRONEAI_BIND_ADDRESS:-127.0.0.1}:${DRONEAI_MINIO_CONSOLE_PORT:-30090}:9001
      - ${DRONEAI_BIND_ADDRESS:-127.0.0.1}:${DRONEAI_MINIO_API_PORT:-30091}:9000
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set droneai http://minio:9000 minioadmin minioadmin >/dev/null 2>&1; do
          sleep 2
        done
        mc mb --ignore-existing droneai/drone-ai

  db-migrate:
    image: drone-dashboard-api:latest
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-environment
    command: [alembic, upgrade, head]

  dashboard-api:
    image: drone-dashboard-api:latest
    restart: unless-stopped
    depends_on: *worker-dependencies
    environment:
      <<: *common-environment
      CORS_ORIGINS: "*"
      DRONEAI_ENV: development
      DRONEAI_AUTH_DISABLED: "true"
      DRONEAI_EMBED_CONTROL_LOOPS: "false"
      DRONEAI_RUNTIME_MODE: compose
      DRONEAI_UPLOAD_MAX_FILES: "2500"
      DRONEAI_UPLOAD_MAX_FILE_BYTES: "2147483648"
      DRONEAI_UPLOAD_MAX_BATCH_BYTES: "53687091200"
      DRONEAI_TILE_RATE_LIMIT_PER_MINUTE: "600"
      DRONEAI_TILE_RATE_LIMIT_BURST: "120"
      DRONEAI_TILE_RATE_LIMIT_MAX_CLIENTS: "10000"
      WORK_DRIVES: '${DRONEAI_WORK_DRIVES_JSON:-[{"name":"local","label":"Local persistent workspace","mount":"/work/local"}]}'
      WORK_DRIVE_DEFAULT: ${DRONEAI_WORK_DRIVE_DEFAULT:-local}
    ports:
      - ${DRONEAI_BIND_ADDRESS:-127.0.0.1}:${DRONEAI_API_PORT:-30080}:8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 30

  dashboard-control-worker:
    image: drone-dashboard-api:latest
    restart: unless-stopped
    depends_on: *worker-dependencies
    environment:
      <<: *common-environment
      DRONEAI_ENV: development
      DRONEAI_STAGE_JOBS_ENABLED: "false"
    command: [python, -m, app4-dashboard.api.control_worker]

  dashboard-frontend:
    image: drone-dashboard-frontend:latest
    restart: unless-stopped
    depends_on:
      dashboard-api:
        condition: service_healthy
    environment:
      DRONEAI_PUBLIC_API_URL: http://${DRONEAI_ACCESS_HOST:-localhost}:${DRONEAI_API_PORT:-30080}
    ports:
      - ${DRONEAI_BIND_ADDRESS:-127.0.0.1}:${DRONEAI_DASHBOARD_PORT:-30000}:3000
    healthcheck:
      test: [CMD-SHELL, wget -q -O /dev/null http://localhost:3000/]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  kafka-data:
  minio-data:
