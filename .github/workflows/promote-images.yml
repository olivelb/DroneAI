name: Signed image promotion

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: signed-promotion-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PROJECT: ${{ github.repository_owner }}/droneai

jobs:
  preflight:
    name: Verify signed release and qualification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify tag, version and main ancestry
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          test "${release_sha}" = "${GITHUB_SHA}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${release_sha}" origin/main
          tag_object_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object | select(.type == "tag") | .sha')"
          test -n "${tag_object_sha}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" --jq '.verification.verified')" = "true"
          python tools/check_platform_version.py --tag "${RELEASE_TAG}"
          echo "release_sha=${release_sha}" >> "${GITHUB_OUTPUT}"
      - name: Require commit-scoped CI, CUDA, GPU and CodeQL runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m scripts.ci.verify_release_qualification \
            --commit "${GITHUB_SHA}" \
            --repository "${GITHUB_REPOSITORY}" \
            --output promotion-evidence/qualification-runs.json
      - name: Retain qualification run identities
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-qualification-${{ github.sha }}
          path: promotion-evidence/qualification-runs.json
          if-no-files-found: error
          retention-days: 90

  cpu-images:
    name: Build, scan and sign ${{ matrix.name }}
    needs: preflight
    environment: production-promotion
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: drone-ia
            dockerfile: app2-ia/Dockerfile
          - name: drone-dashboard-api
            dockerfile: app4-dashboard/api/Dockerfile
          - name: drone-dashboard-frontend
            dockerfile: app4-dashboard/frontend/Dockerfile
    env:
      IMAGE_REF: ghcr.io/${{ github.repository_owner }}/droneai/${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Build and push source-bound image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_REF }}:${{ needs.preflight.outputs.release_sha }}
          labels: |
            org.opencontainers.image.revision=${{ needs.preflight.outputs.release_sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true
      - name: Generate CycloneDX evidence and reject fixable CVEs
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          bash scripts/ci/promote_image.sh \
            --name "${IMAGE_NAME}" \
            --image "${IMAGE_REF}" \
            --digest "${DIGEST}" \
            --source-commit "${GITHUB_SHA}"
      - name: Publish GitHub build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE_REF }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Retain image evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-${{ matrix.name }}-${{ github.sha }}
          path: promotion-evidence/
          if-no-files-found: error
          retention-days: 90

  cuda-images:
    name: Build, scan and sign CUDA images
    needs: preflight
    environment: production-promotion
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      BASE_REF: ghcr.io/${{ github.repository_owner }}/droneai/drone-colmap-base
      COLMAP_REF: ghcr.io/${{ github.repository_owner }}/droneai/drone-colmap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Prepare pinned COLMAP dependencies
        run: bash setup_deps.sh
      - name: Build and push CUDA/COLMAP base
        id: base
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: app1-colmap/Dockerfile.base
          push: true
          tags: ${{ env.BASE_REF }}:${{ needs.preflight.outputs.release_sha }}
          labels: |
            org.opencontainers.image.revision=${{ needs.preflight.outputs.release_sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true
      - name: Scan and sign CUDA/COLMAP base
        env:
          DIGEST: ${{ steps.base.outputs.digest }}
        run: |
          set -euo pipefail
          bash scripts/ci/promote_image.sh \
            --name drone-colmap-base \
            --image "${BASE_REF}" \
            --digest "${DIGEST}" \
            --source-commit "${GITHUB_SHA}"
      - name: Publish base build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.BASE_REF }}
          subject-digest: ${{ steps.base.outputs.digest }}
          push-to-registry: true
      - name: Build and push COLMAP runtime from exact base digest
        id: colmap
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: app1-colmap/Dockerfile
          build-args: COLMAP_BASE_IMAGE=${{ env.BASE_REF }}@${{ steps.base.outputs.digest }}
          push: true
          tags: ${{ env.COLMAP_REF }}:${{ needs.preflight.outputs.release_sha }}
          labels: |
            org.opencontainers.image.revision=${{ needs.preflight.outputs.release_sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true
      - name: Scan and sign COLMAP runtime
        env:
          DIGEST: ${{ steps.colmap.outputs.digest }}
        run: |
          set -euo pipefail
          bash scripts/ci/promote_image.sh \
            --name drone-colmap \
            --image "${COLMAP_REF}" \
            --digest "${DIGEST}" \
            --source-commit "${GITHUB_SHA}"
      - name: Publish COLMAP build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.COLMAP_REF }}
          subject-digest: ${{ steps.colmap.outputs.digest }}
          push-to-registry: true
      - name: Retain CUDA image evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-cuda-${{ github.sha }}
          path: promotion-evidence/
          if-no-files-found: error
          retention-days: 90

  manifest:
    name: Assemble and sign release manifest
    needs: [preflight, cpu-images, cuda-images]
    environment: production-promotion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: promotion-*-${{ github.sha }}
          path: promotion-evidence
          merge-multiple: true
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Build and keyless-sign release manifest
        run: |
          set -euo pipefail
          python3 tools/promotion_manifest.py assemble \
            --records-directory promotion-evidence \
            --qualification-runs promotion-evidence/qualification-runs.json \
            --release-tag "${GITHUB_REF_NAME}" \
            --source-commit "${GITHUB_SHA}" \
            --output promotion-evidence/release-manifest.json
          cosign sign-blob --yes \
            --bundle promotion-evidence/release-manifest.sigstore.json \
            promotion-evidence/release-manifest.json
          cosign verify-blob \
            --bundle promotion-evidence/release-manifest.sigstore.json \
            --certificate-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/promote-images.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            promotion-evidence/release-manifest.json
      - name: Retain signed release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-manifest-${{ github.ref_name }}-${{ github.sha }}
          path: |
            promotion-evidence/release-manifest.json
            promotion-evidence/release-manifest.sigstore.json
          if-no-files-found: error
          retention-days: 90
