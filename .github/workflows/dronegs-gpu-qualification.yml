name: DroneGS GPU qualification

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dronegs-gpu-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select GPU qualification requirement
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      gpu_required: ${{ steps.selection.outputs.gpu_required }}
      reason: ${{ steps.selection.outputs.reason }}
    steps:
      - name: Checkout event history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; runner >= 2.327.1
        with:
          fetch-depth: 0
      - name: Detect explicit dispatch or GPU-relevant change
        id: selection
        run: python3 -m scripts.ci.select_gpu_validation
      - name: Report selection
        run: echo "GPU qualification=${{ steps.selection.outputs.gpu_required }} reason=${{ steps.selection.outputs.reason }}"

  cuda-tests:
    needs: changes
    if: >-
      needs.changes.outputs.gpu_required == 'true' &&
      vars.DRONEGS_GPU_CI == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, gpu, cuda, msi]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; runner >= 2.327.1
      - name: Run native CUDA suites in the development container
        run: |
          set -o pipefail
          scripts/ci/validate_cuda_containers.sh gpu 2>&1 | tee gpu-validation.log
      - name: Publish qualification summary
        if: always()
        run: |
          {
            echo "## DroneGS GPU qualification"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Runner: \`${RUNNER_NAME}\`"
            echo "- Workflow result: \`${{ job.status }}\`"
            echo "- Full native CUDA and driver-injection output: artifact \`dronegs-gpu-validation-${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload GPU qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dronegs-gpu-validation-${{ github.sha }}
          path: gpu-validation.log
          if-no-files-found: warn
          retention-days: 30

  gpu-gate:
    name: GPU qualification gate
    needs: [changes, cuda-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require physical GPU evidence when selected
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          python3 -m scripts.ci.check_selected_jobs --selector changes
          --job cuda-tests=gpu_required
