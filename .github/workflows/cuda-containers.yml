name: CUDA container validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cuda-containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-change:
    name: Select CUDA build requirement
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build_required: ${{ steps.selection.outputs.build_required }}
      reason: ${{ steps.selection.outputs.reason }}
    steps:
      - name: Checkout event history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect explicit dispatch or version change
        id: selection
        run: python3 scripts/ci/select_cuda_builds.py
      - name: Report selection
        run: echo "CUDA build selection=${{ steps.selection.outputs.build_required }} reason=${{ steps.selection.outputs.reason }}"

  cuda-container-build:
    name: CUDA Dockerfile build contracts
    needs: version-change
    if: needs.version-change.outputs.build_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build CUDA images and portable binaries
        run: scripts/ci/validate_cuda_containers.sh build

  cuda-runtime-supply-chain:
    name: CUDA runtime SBOM and vulnerability gate
    needs: version-change
    if: needs.version-change.outputs.build_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: drone-colmap-base:ci
            artifact: cuda-colmap-base
            dockerfile: app1-colmap/Dockerfile.base
          - image: drone-local-gaussian:ci
            artifact: cuda-local-gaussian
            dockerfile: app1-colmap/Dockerfile.local-gaussian
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare pinned COLMAP build dependencies
        run: bash setup_deps.sh
      - name: Build ${{ matrix.image }} runtime image
        run: >-
          docker build
          --tag "${{ matrix.image }}"
          --file "${{ matrix.dockerfile }}"
          .
      - name: Generate CycloneDX image SBOM
        run: |
          mkdir -p supply-chain
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD/supply-chain:/output" \
            anchore/syft:v1.50.0@sha256:1288ea4c8b38767b4e620c1e312c8cb26b6e887a99b4f07ab6cd19fc6f225026 \
            "docker:${{ matrix.image }}" \
            --output "cyclonedx-json=/output/${{ matrix.artifact }}.cdx.json"
      - name: Record HIGH and CRITICAL image vulnerabilities
        run: |
          mkdir -p .trivy-cache
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD/.trivy-cache:/root/.cache" \
            --volume "$PWD/supply-chain:/output" \
            aquasec/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            image --image-src docker --scanners vuln --ignore-unfixed \
            --severity HIGH,CRITICAL --format json \
            --output "/output/${{ matrix.artifact }}.trivy.json" \
            "${{ matrix.image }}"
      - name: Reject fixed HIGH and CRITICAL image vulnerabilities
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          --volume "$PWD/.trivy-cache:/root/.cache"
          aquasec/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c
          image --image-src docker --scanners vuln --ignore-unfixed
          --severity HIGH,CRITICAL --exit-code 1
          "${{ matrix.image }}"
      - name: Upload CUDA image supply-chain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-${{ matrix.artifact }}-${{ github.sha }}
          path: supply-chain/
          if-no-files-found: warn
          retention-days: 30

  cuda-gate:
    name: CUDA validation gate
    needs:
      - version-change
      - cuda-container-build
      - cuda-runtime-supply-chain
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected CUDA job to pass
        run: |
          for result in \
            "${{ needs.version-change.result }}" \
            "${{ needs.cuda-container-build.result }}" \
            "${{ needs.cuda-runtime-supply-chain.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "Selected CUDA job concluded: $result" >&2; exit 1 ;;
            esac
          done
