name: Platform release contract

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  version-contract:
    name: Validate platform tag and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate synchronized version and tag
        run: python tools/check_platform_version.py --tag "$GITHUB_REF_NAME"
