name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dronegs-core:
    name: DroneGS native CPU contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends cmake ninja-build libjpeg-dev python3
      - name: Configure native tests
        run: >-
          cmake -S app1-colmap/dronegs -B build/dronegs-core -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CUDA_ARCHITECTURES=75
          -DDRONEGS_BUILD_TESTS=ON
          -DDRONEGS_BUILD_BENCHMARKS=OFF
      - name: Build CPU test targets
        run: >-
          cmake --build build/dronegs-core
          --target dronegs_core_tests dronegs_rasterization_tests
      - name: Run CPU contract tests
        run: >-
          ctest --test-dir build/dronegs-core --output-on-failure
          -R "dronegs_(core|rasterization)_tests"

  dronegs-cuda-build:
    name: DroneGS portable CUDA build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends cmake ninja-build libjpeg-dev
      - name: Configure portable CUDA binary
        run: >-
          cmake -S app1-colmap/dronegs -B build/dronegs-cuda -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DDRONEGS_CUDA_ARCHITECTURES=portable
          -DDRONEGS_BUILD_TESTS=OFF
          -DDRONEGS_BUILD_BENCHMARKS=OFF
      - name: Build production binary
        run: cmake --build build/dronegs-cuda --target dronegs
      - name: Smoke-test CLI
        run: build/dronegs-cuda/dronegs --version

  python:
    name: Python quality and CPU tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install development dependencies
        run: python -m pip install --requirement requirements/dev.txt
      - name: Compile Python sources
        run: >-
          python -m compileall -q
          app1-colmap app2-ia app3-processing
          app4-dashboard/api shared alembic tests tools
      - name: Lint
        run: python -m ruff check .
      - name: Run CPU tests
        run: python -m pytest -m "not gpu and not integration" --junitxml=test-results/pytest.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results/pytest.xml
          if-no-files-found: ignore

  migrations:
    name: PostgreSQL/PostGIS migration round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: droneai
          POSTGRES_PASSWORD: droneai-ci
          POSTGRES_DB: droneai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U droneai -d droneai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg2://droneai:droneai-ci@localhost:5432/droneai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: python -m pip install --requirement requirements/dev.txt
      - name: Upgrade, downgrade and re-upgrade schema
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app4-dashboard/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app4-dashboard/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
