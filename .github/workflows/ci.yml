name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dronegs-core:
    name: DroneGS native CPU contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install native build dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends cmake ninja-build libjpeg-dev python3
      - name: Configure native tests
        run: >-
          cmake -S app1-colmap/dronegs -B build/dronegs-core -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CUDA_ARCHITECTURES=75
          -DDRONEGS_BUILD_TESTS=ON
          -DDRONEGS_BUILD_BENCHMARKS=OFF
      - name: Build CPU test targets
        run: >-
          cmake --build build/dronegs-core
          --target dronegs_core_tests dronegs_rasterization_tests
      - name: Run CPU contract tests
        run: >-
          ctest --test-dir build/dronegs-core --output-on-failure
          -R "dronegs_(core|rasterization)_tests"

  dronegs-cuda-build:
    name: DroneGS portable CUDA build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install native build dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends cmake ninja-build libjpeg-dev
      - name: Configure portable CUDA binary
        run: >-
          cmake -S app1-colmap/dronegs -B build/dronegs-cuda -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DDRONEGS_CUDA_ARCHITECTURES=portable
          -DDRONEGS_BUILD_TESTS=OFF
          -DDRONEGS_BUILD_BENCHMARKS=OFF
      - name: Build production binary
        run: cmake --build build/dronegs-cuda --target dronegs
      - name: Smoke-test CLI
        run: build/dronegs-cuda/dronegs --version

  python:
    name: Python quality and CPU tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install development dependencies
        run: python -m pip install --requirement requirements/dev.txt
      - name: Compile Python sources
        run: >-
          python -m compileall -q
          app1-colmap app2-ia app3-processing
          app4-dashboard/api shared alembic tests tools
      - name: Lint
        run: python -m ruff check .
      - name: Enforce complexity and unused-code budgets
        run: >-
          python -m ruff check --select C90,F401,F841
          app1-colmap app2-ia app3-processing app4-dashboard/api shared tools
      - name: Enforce COLMAP worker maintainability rules
        run: |
          python -m ruff check --select B,SIM,UP,RUF,ASYNC app1-colmap/colmap_worker app1-colmap/main.py
          python -m ruff check --select C90 --config lint.mccabe.max-complexity=15 app1-colmap/colmap_worker
      - name: Type-check the complete COLMAP worker package
        run: >-
          python -m mypy --strict --ignore-missing-imports --follow-imports=skip
          app1-colmap/colmap_worker
      - name: Run CPU tests with branch coverage
        run: |
          python -m coverage erase
          python -m coverage run -m pytest -m "not gpu and not integration" --junitxml=test-results/pytest.xml
          python -m coverage report
          python -m coverage xml -o test-results/coverage.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pytest-results
          path: |
            test-results/pytest.xml
            test-results/coverage.xml
          if-no-files-found: ignore

  migrations:
    name: PostgreSQL/PostGIS migration round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: droneai
          POSTGRES_PASSWORD: droneai-ci
          POSTGRES_DB: droneai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U droneai -d droneai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg2://droneai:droneai-ci@localhost:5432/droneai
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: python -m pip install --requirement requirements/dev.txt
      - name: Upgrade, downgrade and re-upgrade schema
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app4-dashboard/frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app4-dashboard/frontend/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Reject duplicated Python production code
        run: npm run duplication
      - run: npm run test
      - run: npm run lint
      - run: npm run build

  container-smoke:
    name: Service image import smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: droneai-api:ci
            dockerfile: app4-dashboard/api/Dockerfile
            command: >-
              import importlib, os;
              assert os.getuid() == 10001;
              app = importlib.import_module('app4-dashboard.api.main').app;
              assert len(app.openapi()['paths']) >= 25
          - image: drone-processing:ci
            dockerfile: app3-processing/Dockerfile
            command: >-
              import os, sys;
              assert os.getuid() == 10001;
              sys.path.insert(0, '/app/app3-processing');
              import analysis_workflow, orthomosaic_tiler
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build ${{ matrix.image }}
        run: >-
          docker build
          --tag "${{ matrix.image }}"
          --file "${{ matrix.dockerfile }}"
          .
      - name: Import runtime modules
        run: >-
          docker run --rm
          --read-only
          --tmpfs /tmp
          --entrypoint python3
          "${{ matrix.image }}"
          -c "${{ matrix.command }}"

  helm:
    name: Helm production render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5
      - name: Lint chart
        run: helm lint charts/drone-ai
      - name: Render production values
        run: >-
          helm template drone-ai charts/drone-ai
          --values charts/drone-ai/values-production.example.yaml
          > /tmp/drone-ai-production.yaml
      - name: Verify production storage Secret references
        run: |
          if grep -Eq '^[[:space:]]+name: drone-ai-storage$' /tmp/drone-ai-production.yaml; then
            echo "Production render still references the chart-managed storage Secret" >&2
            exit 1
          fi
          grep -Eq '^[[:space:]]+name: drone-ai-storage-production$' /tmp/drone-ai-production.yaml
