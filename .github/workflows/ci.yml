name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select required CI scopes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.scopes.outputs.python }}
      duplication: ${{ steps.scopes.outputs.duplication }}
      docs: ${{ steps.scopes.outputs.docs }}
      dronegs: ${{ steps.scopes.outputs.dronegs }}
      migrations: ${{ steps.scopes.outputs.migrations }}
      integration: ${{ steps.scopes.outputs.integration }}
      frontend: ${{ steps.scopes.outputs.frontend }}
      frontend_container: ${{ steps.scopes.outputs.frontend_container }}
      containers: ${{ steps.scopes.outputs.containers }}
      helm: ${{ steps.scopes.outputs.helm }}
      infra: ${{ steps.scopes.outputs.infra }}
    steps:
      - name: Checkout pull-request history
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Checkout current revision
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Classify changed paths
        id: scopes
        run: python3 scripts/ci/select_ci_jobs.py

  docs:
    name: Documentation and qualification contracts
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/check_markdown_links.py
      - name: Validate production qualification evidence
        run: python3 tools/production_qualification.py check-tree docs/benchmarks

  dronegs-core:
    name: DroneGS native CPU contract tests
    needs: changes
    if: needs.changes.outputs.dronegs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: nvidia/cuda:12.9.2-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native build dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends cmake ninja-build libjpeg-dev python3
      - name: Configure native tests
        run: >-
          cmake -S app1-colmap/dronegs -B build/dronegs-core -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CUDA_ARCHITECTURES=75
          -DDRONEGS_BUILD_TESTS=ON
          -DDRONEGS_BUILD_BENCHMARKS=OFF
      - name: Build CPU test targets
        run: >-
          cmake --build build/dronegs-core
          --target dronegs_core_tests dronegs_rasterization_tests
      - name: Run CPU contract tests
        run: >-
          ctest --test-dir build/dronegs-core --output-on-failure
          -R "dronegs_(core|rasterization)_tests"

  python:
    name: Python 3.12 quality and CPU tests
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install development dependencies
        run: python -m pip install --require-hashes --requirement requirements/dev.txt
      - name: Run shared static quality checks
        run: make static PYTHON=python
      - name: Audit locked Python environment
        run: make audit PYTHON=python
      - name: Run CPU tests with branch coverage
        run: |
          python -m coverage erase
          python -m coverage run -m pytest -m "not gpu and not integration" --junitxml=test-results/pytest.xml
          python -m coverage report
          python -m coverage xml -o test-results/coverage.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-results-python-3.12
          path: |
            test-results/pytest.xml
            test-results/coverage.xml
          if-no-files-found: ignore

  migrations:
    name: PostgreSQL/PostGIS migration round-trip
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: droneai
          POSTGRES_PASSWORD: droneai-ci
          POSTGRES_DB: droneai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U droneai -d droneai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg2://droneai:droneai-ci@localhost:5432/droneai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: python -m pip install --require-hashes --requirement requirements/dev.txt
      - name: Upgrade, downgrade and re-upgrade schema
        run: |
          alembic upgrade 0024
          python scripts/ci/verify_identity_migration.py seed
          alembic upgrade 0025
          python scripts/ci/verify_identity_migration.py verify
          python scripts/ci/verify_rls_migration.py seed
          alembic upgrade head
          python scripts/ci/verify_rls_migration.py verify
          python -m pytest -q -m integration \
            tests/integration/test_identity_postgres.py \
            tests/integration/test_tenant_rls_postgres.py
          alembic downgrade base
          alembic upgrade head
      - name: Exercise PostgreSQL scheduler transaction boundary
        run: >-
          python -m pytest -q -m integration
          tests/integration/test_stage_scheduler_postgres.py

  integration:
    name: PostgreSQL, Kafka and S3 composition
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+psycopg2://droneai:droneai-local@localhost:5432/droneai
      KAFKA_BROKER: localhost:29092
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: drone-ai
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: python -m pip install --require-hashes --requirement requirements/dev.txt
      - name: Start real platform dependencies
        run: |
          compose=(
            docker compose
            --project-name droneai-integration
            --file compose.local.yaml
            --file .github/compose.integration.yaml
          )
          "${compose[@]}" up --detach --wait postgres kafka minio
          "${compose[@]}" run --rm --no-deps kafka-init
          "${compose[@]}" run --rm --no-deps minio-init
      - name: Apply schema and exercise service composition
        run: |
          alembic upgrade head
          make integration-test PYTHON=python
      - name: Show dependency logs on failure
        if: failure()
        run: >-
          docker compose
          --project-name droneai-integration
          --file compose.local.yaml
          --file .github/compose.integration.yaml
          logs --no-color postgres kafka minio
      - name: Stop integration dependencies
        if: always()
        run: >-
          docker compose
          --project-name droneai-integration
          --file compose.local.yaml
          --file .github/compose.integration.yaml
          down --volumes

  duplication:
    name: Python production duplication
    needs: changes
    if: needs.changes.outputs.duplication == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app4-dashboard/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app4-dashboard/frontend/package-lock.json
      - run: corepack npm ci --ignore-scripts
      - run: corepack npm run duplication

  frontend:
    name: Frontend lint and build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app4-dashboard/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app4-dashboard/frontend/package-lock.json
      - run: corepack npm ci
      - name: Audit production dependencies
        run: corepack npm audit --omit=dev --audit-level=high
      - run: corepack npm run test
      - run: corepack npm run lint
      - run: corepack npm run typecheck
      - run: corepack npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser mission journeys
        run: corepack npm run test:e2e
      - name: Upload Playwright failure report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: app4-dashboard/frontend/playwright-report/
          if-no-files-found: ignore

  frontend-container:
    name: Frontend image supply-chain smoke test
    needs: changes
    if: needs.changes.outputs.frontend_container == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build frontend runtime image
        run: >-
          docker build
          --tag drone-dashboard-frontend:ci
          --file app4-dashboard/frontend/Dockerfile
          .
      - name: Verify non-root read-only runtime
        run: >-
          docker run --rm
          --read-only
          --tmpfs /tmp
          --tmpfs /app/.next/cache
          --entrypoint node
          drone-dashboard-frontend:ci
          -e "const fs=require('node:fs');
          if(process.getuid()!==1000)throw new Error('unexpected uid');
          if(fs.existsSync('/usr/local/lib/node_modules/npm'))throw new Error('npm in runtime');
          require('next/package.json');
          fs.accessSync('/app/.next/BUILD_ID')"
      - name: Generate frontend CycloneDX image SBOM
        run: |
          mkdir -p supply-chain
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD/supply-chain:/output" \
            anchore/syft:v1.50.0@sha256:1288ea4c8b38767b4e620c1e312c8cb26b6e887a99b4f07ab6cd19fc6f225026 \
            docker:drone-dashboard-frontend:ci \
            --output cyclonedx-json=/output/dashboard-frontend.cdx.json
      - name: Record frontend HIGH and CRITICAL vulnerabilities
        run: |
          mkdir -p .trivy-cache
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD/.trivy-cache:/root/.cache" \
            --volume "$PWD/supply-chain:/output" \
            aquasec/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            image --image-src docker --scanners vuln --ignore-unfixed \
            --severity HIGH,CRITICAL --format json \
            --output /output/dashboard-frontend.trivy.json \
            drone-dashboard-frontend:ci
      - name: Reject fixed frontend CRITICAL vulnerabilities
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          --volume "$PWD/.trivy-cache:/root/.cache"
          aquasec/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c
          image --image-src docker --scanners vuln --ignore-unfixed
          --severity CRITICAL --exit-code 1
          drone-dashboard-frontend:ci
      - name: Upload frontend supply-chain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-dashboard-frontend-${{ github.sha }}
          path: supply-chain/
          if-no-files-found: warn
          retention-days: 30

  container-smoke:
    name: Service image import smoke tests
    needs: changes
    if: needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: droneai-api:ci
            artifact: dashboard-api
            dockerfile: app4-dashboard/api/Dockerfile
            command: >-
              import importlib, os;
              assert os.getuid() == 10001;
              app = importlib.import_module('app4-dashboard.api.main').app;
              assert len(app.openapi()['paths']) >= 25
          - image: drone-processing:ci
            artifact: processing-worker
            dockerfile: app3-processing/Dockerfile
            command: >-
              import os, sys;
              assert os.getuid() == 10001;
              sys.path.insert(0, '/app/app3-processing');
              import analysis_workflow, orthomosaic_tiler
          - image: drone-ia:ci
            artifact: ia-worker
            dockerfile: app2-ia/Dockerfile
            command: >-
              import os, sys, torch, torchvision, ultralytics;
              assert os.getuid() == 10001;
              assert torch.version.cuda == '12.9';
              assert torchvision.__version__.endswith('+cu129');
              assert ultralytics.__version__ == '8.4.0';
              sys.path.insert(0, '/app/app2-ia');
              import detection_core, tile_detection_workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build ${{ matrix.image }}
        run: >-
          docker build
          --tag "${{ matrix.image }}"
          --file "${{ matrix.dockerfile }}"
          .
      - name: Import runtime modules
        run: >-
          docker run --rm
          --read-only
          --tmpfs /tmp
          --entrypoint python3
          "${{ matrix.image }}"
          -c "${{ matrix.command }}"
      - name: Generate CycloneDX image SBOM
        run: |
          mkdir -p supply-chain
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD/supply-chain:/output" \
            anchore/syft:v1.50.0@sha256:1288ea4c8b38767b4e620c1e312c8cb26b6e887a99b4f07ab6cd19fc6f225026 \
            "docker:${{ matrix.image }}" \
            --output "cyclonedx-json=/output/${{ matrix.artifact }}.cdx.json"
      - name: Record HIGH and CRITICAL image vulnerabilities
        run: |
          mkdir -p .trivy-cache
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD/.trivy-cache:/root/.cache" \
            --volume "$PWD/supply-chain:/output" \
            aquasec/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            image --image-src docker --scanners vuln --ignore-unfixed \
            --severity HIGH,CRITICAL --format json \
            --output "/output/${{ matrix.artifact }}.trivy.json" \
            "${{ matrix.image }}"
      - name: Reject fixed CRITICAL image vulnerabilities
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          --volume "$PWD/.trivy-cache:/root/.cache"
          aquasec/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c
          image --image-src docker --scanners vuln --ignore-unfixed
          --severity CRITICAL --exit-code 1
          "${{ matrix.image }}"
      - name: Upload image supply-chain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-${{ matrix.artifact }}-${{ github.sha }}
          path: supply-chain/
          if-no-files-found: warn
          retention-days: 30

  helm:
    name: Helm production render
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Lint chart
        run: helm lint charts/drone-ai
      - name: Render production values
        run: >-
          helm template drone-ai charts/drone-ai
          --values charts/drone-ai/values-production.example.yaml
          --set-string colmapWorker.tag="${GITHUB_SHA}"
          --set-string iaWorker.tag="${GITHUB_SHA}"
          --set-string processingWorker.tag="${GITHUB_SHA}"
          --set-string dashboardApi.tag="${GITHUB_SHA}"
          --set-string dashboardFrontend.tag="${GITHUB_SHA}"
          > /tmp/drone-ai-production.yaml
      - name: Render OVHcloud preproduction values
        run: >-
          helm template drone-ai charts/drone-ai
          --values charts/drone-ai/values-ovh-preprod.example.yaml
          --set-string processingWorker.tag="${GITHUB_SHA}"
          --set-string dashboardApi.tag="${GITHUB_SHA}"
          --set-string dashboardFrontend.tag="${GITHUB_SHA}"
          > /tmp/drone-ai-ovh-preprod.yaml
      - name: Verify production storage Secret references
        run: |
          if grep -Eq '^[[:space:]]+name: drone-ai-storage$' /tmp/drone-ai-production.yaml; then
            echo "Production render still references the chart-managed storage Secret" >&2
            exit 1
          fi
          grep -Eq '^[[:space:]]+name: drone-ai-storage-production$' /tmp/drone-ai-production.yaml
      - name: Verify production application images are immutable
        run: |
          if grep -Eq '^[[:space:]]+image: .+:(latest|main|stable)$' /tmp/drone-ai-production.yaml; then
            echo "Mutable application image tag found in the production render" >&2
            exit 1
          fi
          test "$(grep -Ec '^[[:space:]]+image: .+:[0-9a-f]{40}$' /tmp/drone-ai-production.yaml)" -ge 5
      - name: Verify preproduction cost and image guards
        run: |
          if grep -Eq '^[[:space:]]+name: (colmap-worker|ia-worker)$' /tmp/drone-ai-ovh-preprod.yaml; then
            echo "GPU workers must remain opt-in in the preproduction overlay" >&2
            exit 1
          fi
          if grep -Eq '^[[:space:]]+image: .+:latest$' /tmp/drone-ai-ovh-preprod.yaml; then
            echo "Mutable service image tag found in the preproduction render" >&2
            exit 1
          fi
          grep -Eq 'drone-ai-storage-preprod' /tmp/drone-ai-ovh-preprod.yaml

  infra:
    name: OVHcloud Terraform static validation
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.6
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/ovh
      - name: Initialize providers without a backend
        run: terraform -chdir=infra/ovh/preprod init -backend=false -input=false
      - name: Validate OVHcloud configuration without credentials
        run: terraform -chdir=infra/ovh/preprod validate
      - name: Check cloud deployment script
        run: shellcheck scripts/deploy/publish-preprod-images.sh

  ci-gate:
    name: CI gate
    needs:
      - changes
      - docs
      - dronegs-core
      - python
      - duplication
      - migrations
      - integration
      - frontend
      - frontend-container
      - container-smoke
      - helm
      - infra
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected job to pass
        run: |
          for result in \
            "${{ needs.changes.result }}" \
            "${{ needs.docs.result }}" \
            "${{ needs.dronegs-core.result }}" \
            "${{ needs.python.result }}" \
            "${{ needs.duplication.result }}" \
            "${{ needs.migrations.result }}" \
            "${{ needs.integration.result }}" \
            "${{ needs.frontend.result }}" \
            "${{ needs.frontend-container.result }}" \
            "${{ needs.container-smoke.result }}" \
            "${{ needs.helm.result }}" \
            "${{ needs.infra.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "Selected CI job concluded: $result" >&2; exit 1 ;;
            esac
          done
