name: Native GSTile viewer
on:
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-viewer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Select native viewer qualification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      viewer_required: ${{ steps.selection.outputs.viewer_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: selection
        run: python3 -m scripts.ci.select_native_viewer
  windows:
    name: Windows viewer build and contracts
    needs: changes
    if: needs.changes.outputs.viewer_required == 'true'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify benchmark HTTP error isolation
        run: node --test native-viewer/benchmarks/server-errors.test.mjs
      - name: Build portable executable and run contract tests
        shell: pwsh
        run: |
          ./native-viewer/build.ps1 -BuildDirectory "$env:GITHUB_WORKSPACE/native-viewer/build" -OutputDirectory "$env:RUNNER_TEMP/GSTileViewer"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GSTileViewer-windows-x64
          path: "${{ runner.temp }}/GSTileViewer"
      # GPU qualification runs on target hardware, not hosted software adapters.

  viewer-gate:
    name: Native viewer gate
    needs: [changes, windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require selected Windows build and contract tests
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          python3 -m scripts.ci.check_selected_jobs --selector changes
          --job windows=viewer_required
