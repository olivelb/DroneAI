# OVHcloud preproduction overlay. Replace every REPLACE_* value before install.
# Fused GPU workers remain disabled. Bounded Jobs may stay Pending until a GPU
# flavor/quota has been confirmed and the corresponding node pool exists.
global:
  namespace: drone-ai-preprod
  createNamespace: false
  imageRegistry: "REPLACE_REGISTRY_URL/droneai/"
  imagePullPolicy: IfNotPresent
  imagePullSecrets:
    - name: drone-ai-registry

kafka:
  enabled: true
  image: apache/kafka:3.7.0@sha256:41c20d65b0a2180b9deca056d47540771752e69fe9225d5748dd65a25a9675d7
  broker: ""
  persistence:
    enabled: true
    hostPath: ""
    storageClass: csi-cinder-high-speed
    size: 20Gi

minio:
  enabled: false

postgres:
  enabled: true
  image: postgis/postgis:16-3.5@sha256:7d7925e334fceb6079c0a5d150e925f192cde2cf1dd78767ca843e2996d39829
  existingSecret: drone-ai-postgres
  passwordSecretKey: password
  password: ""
  persistence:
    hostPath: ""
    storageClass: csi-cinder-high-speed-gen2
    size: 20Gi
  backup:
    enabled: true
    schedule: "17 2 * * *"
    timeZone: Etc/UTC
    prefix: postgres
    slots: 7
    existingSecret: drone-ai-backup-preprod
    s3Endpoint: "REPLACE_S3_ENDPOINT_URL"
    s3Bucket: droneai-preprod-backups-fe7dc125
    s3Region: GRA

storage:
  existingSecret: drone-ai-storage-preprod
  accessKeySecretKey: s3-access-key
  secretKeySecretKey: s3-secret-key
  databaseUrlSecretKey: database-url
  s3Endpoint: "REPLACE_S3_ENDPOINT_URL"
  s3PublicEndpoint: "REPLACE_S3_ENDPOINT_URL"
  s3Bucket: droneai-preprod-fe7dc125
  s3AccessKey: ""
  s3SecretKey: ""
  s3Region: GRA
  databaseUrl: ""

colmapWorker:
  enabled: false
  tag: "REPLACE_GIT_SHA"
  resources:
    limits:
      nvidia.com/gpu: "1"
      memory: 32Gi
    requests:
      memory: 16Gi
  workVolume:
    persistentClaim:
      enabled: true
      name: drone-ai-colmap-work
      storageClass: csi-cinder-high-speed
      size: 100Gi
    drives:
      - name: cloud-workspace
        existingClaim: drone-ai-colmap-work
        label: "OVHcloud persistent workspace"
    default: cloud-workspace

iaWorker:
  enabled: false
  tag: "REPLACE_GIT_SHA"
  modelCache:
    hostPath: ""
    storageClass: csi-cinder-high-speed
    size: 30Gi

processingWorker:
  replicaCount: 0
  tag: "REPLACE_GIT_SHA"
  resources:
    limits:
      memory: 4Gi
    requests:
      memory: 2Gi

dashboardApi:
  replicaCount: 2
  tag: "REPLACE_GIT_SHA"
  environment: staging
  # Set true only for a controlled Dashboard qualification before a candidate
  # quality profile is promoted to the public catalog.
  qualityProfileCandidatesEnabled: false
  databaseUrlSecretKey: api-database-url
  rowLevelSecurityRequired: true
  observability:
    metricsEnabled: true
  saas:
    organizationRequestQuotasEnabled: true
  controlWorker:
    replicaCount: 2
    leaderElection:
      enabled: true
  service:
    type: ClusterIP
  cors:
    origins: "https://droneai-preprod.olembo.fr"
  auth:
    disabled: false
    databaseAuthEnabled: true
    # Temporary until the first durable preproduction admin is issued.
    allowStaticBootstrap: true
    existingSecret: drone-ai-api-auth
    secretKey: api-keys.json
    sessionSecretKey: session-secret
    credentialPepperSecretKey: credential-pepper

dashboardFrontend:
  tag: "REPLACE_GIT_SHA"
  apiUrl: "https://api-droneai-preprod.olembo.fr"
  service:
    type: ClusterIP

stageJobs:
  enabled: true
  artifactManifestV2WriteEnabled: true
  executors:
    reconstruction:
      image: "REPLACE_REGISTRY_URL/droneai/drone-colmap@sha256:REPLACE_OCI_DIGEST"
      command: ["python3", "app1-colmap/stage_executor.py", "reconstruction"]
      gpu_architecture: REPLACE_GPU_ARCHITECTURE
    gaussian_training:
      image: "REPLACE_REGISTRY_URL/droneai/drone-colmap@sha256:REPLACE_OCI_DIGEST"
      command: ["python3", "app1-colmap/stage_executor.py", "gaussian_training"]
      gpu_architecture: REPLACE_GPU_ARCHITECTURE
    gaussian_filtering:
      image: "REPLACE_REGISTRY_URL/droneai/drone-colmap@sha256:REPLACE_OCI_DIGEST"
      command: ["python3", "app1-colmap/stage_executor.py", "gaussian_filtering"]
      gpu_architecture: REPLACE_GPU_ARCHITECTURE
    rasterization:
      image: "REPLACE_REGISTRY_URL/droneai/drone-colmap@sha256:REPLACE_OCI_DIGEST"
      command: ["python3", "app1-colmap/stage_executor.py", "rasterization"]
      gpu_architecture: REPLACE_GPU_ARCHITECTURE
    detection:
      image: "REPLACE_REGISTRY_URL/droneai/drone-ia@sha256:REPLACE_OCI_DIGEST"
      command: ["python3", "app2-ia/stage_executor.py"]
      gpu_architecture: REPLACE_GPU_ARCHITECTURE
    gaussian_viewer:
      image: "REPLACE_REGISTRY_URL/droneai/drone-colmap@sha256:REPLACE_OCI_DIGEST"
      command: ["python3", "app1-colmap/stage_executor.py", "gaussian_viewer"]
  credentialSecrets:
    reconstruction: drone-ai-stage-reconstruction-preprod
    gaussian_training: drone-ai-stage-gaussian-training-preprod
    gaussian_filtering: drone-ai-stage-gaussian-filtering-preprod
    rasterization: drone-ai-stage-rasterization-preprod
    detection: drone-ai-stage-detection-preprod
    gaussian_viewer: drone-ai-stage-gaussian-viewer-preprod

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: droneai-preprod.olembo.fr
      paths:
        - path: /
          service: dashboard-frontend
    - host: api-droneai-preprod.olembo.fr
      paths:
        - path: /
          service: dashboard-api
  tls:
    - secretName: drone-ai-preprod-tls
      hosts:
        - droneai-preprod.olembo.fr
        - api-droneai-preprod.olembo.fr

gpu:
  runtimeClassName: nvidia
  nodeSelector:
    droneai.io/gpu: nvidia
  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: present
      effect: NoSchedule
