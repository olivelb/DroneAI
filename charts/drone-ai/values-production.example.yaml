# Safe production overlay. Create both referenced Secrets before deployment;
# never commit their values.
global:
  imageRegistry: "registry.example.com/"
  imagePullPolicy: IfNotPresent
  requireImmutableImages: true

storage:
  existingSecret: drone-ai-storage-production
  accessKeySecretKey: s3-access-key
  secretKeySecretKey: s3-secret-key
  databaseUrlSecretKey: database-url
  s3Endpoint: "https://s3.example.com"
  s3PublicEndpoint: "https://s3.example.com"
  s3Bucket: "drone-ai-production"
  s3AccessKey: ""
  s3SecretKey: ""
  databaseUrl: ""

minio:
  enabled: false

postgres:
  enabled: false

# Workspaces shown in the dashboard must correspond to volumes mounted in the
# bounded stage Jobs. Create this claim (or use a cloud CSI provisioner) before
# install. The fused Kafka worker remains development-only.
colmapWorker:
  enabled: false
  # Workspace configuration for Stage Jobs.
  workVolume:
    drives:
      - name: cloud-workspace
        existingClaim: drone-ai-colmap-work
        label: "Cloud persistent workspace"
    default: cloud-workspace

dashboardApi:
  replicaCount: 2
  tag: "REPLACE_GIT_SHA"
  environment: production
  databaseUrlSecretKey: api-database-url
  rowLevelSecurityRequired: true
  observability:
    metricsEnabled: true
  saas:
    organizationRequestQuotasEnabled: true
  controlWorker:
    replicaCount: 2
    leaderElection:
      enabled: true
  service:
    type: ClusterIP
  cors:
    origins: "https://droneai.example.com"
  auth:
    disabled: false
    databaseAuthEnabled: true
    allowStaticBootstrap: false
    existingSecret: drone-ai-api-auth
    secretKey: api-keys.json
    sessionSecretKey: session-secret
    credentialPepperSecretKey: credential-pepper
    sessionMaxAgeSeconds: 28800

dashboardFrontend:
  tag: "REPLACE_GIT_SHA"
  apiUrl: "https://api.droneai.example.com"
  service:
    type: ClusterIP

stageJobs:
  enabled: true
  executors:
    reconstruction:
      image: "registry.example.com/drone-colmap@sha256:REPLACE_OCI_DIGEST"
      command: ["python3", "app1-colmap/stage_executor.py", "reconstruction"]
      gpu_architecture: REPLACE_GPU_ARCHITECTURE
    gaussian_training:
      image: "registry.example.com/drone-colmap@sha256:REPLACE_OCI_DIGEST"
      command: ["python3", "app1-colmap/stage_executor.py", "gaussian_training"]
      gpu_architecture: REPLACE_GPU_ARCHITECTURE
    gaussian_filtering:
      image: "registry.example.com/drone-colmap@sha256:REPLACE_OCI_DIGEST"
      command: ["python3", "app1-colmap/stage_executor.py", "gaussian_filtering"]
      gpu_architecture: REPLACE_GPU_ARCHITECTURE
    rasterization:
      image: "registry.example.com/drone-colmap@sha256:REPLACE_OCI_DIGEST"
      command: ["python3", "app1-colmap/stage_executor.py", "rasterization"]
      gpu_architecture: REPLACE_GPU_ARCHITECTURE
    detection:
      image: "registry.example.com/drone-ia@sha256:REPLACE_OCI_DIGEST"
      command: ["python3", "app2-ia/stage_executor.py"]
      gpu_architecture: REPLACE_GPU_ARCHITECTURE
    gaussian_viewer:
      image: "registry.example.com/drone-colmap@sha256:REPLACE_OCI_DIGEST"
      command: ["python3", "app1-colmap/stage_executor.py", "gaussian_viewer"]
  credentialSecrets:
    reconstruction: drone-ai-stage-reconstruction-production
    gaussian_training: drone-ai-stage-gaussian-training-production
    gaussian_filtering: drone-ai-stage-gaussian-filtering-production
    rasterization: drone-ai-stage-rasterization-production
    detection: drone-ai-stage-detection-production
    gaussian_viewer: drone-ai-stage-gaussian-viewer-production

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: droneai.example.com
      paths:
        - path: /
          service: dashboard-frontend
    - host: api.droneai.example.com
      paths:
        - path: /
          service: dashboard-api
  tls:
    - secretName: droneai-production-tls
      hosts:
        - droneai.example.com
        - api.droneai.example.com
