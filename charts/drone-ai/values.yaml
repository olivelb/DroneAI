# ==========================================================================
# DroneAI Helm values — portable K3s/Kubernetes defaults
# Host paths are intentionally empty: deploy.sh discovers/configures local
# storage, while cloud installations should use PVC-backed storage.
# ==========================================================================

global:
  namespace: drone-ai
  createNamespace: true
  imageRegistry: ""          # empty = local images (docker save → k3s ctr import)
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  # Production overlays enable this guard so mutable application tags cannot
  # be rendered accidentally. Local/K3s development keeps latest support.
  requireImmutableImages: false

# --------------------------------------------------------------------------
# Kafka
# --------------------------------------------------------------------------
kafka:
  enabled: true
  # Empty selects the in-chart Service. Set a host:port here when migrating to
  # an external Kafka service.
  broker: ""
  image: apache/kafka:3.7.0
  clusterId: "droneai-local-cluster-001"
  workerInbox:
    # Long handlers renew this DB lease; a replay waits without committing its
    # Kafka offset until the active claim completes or expires.
    leaseSeconds: 300
    busyRetrySeconds: 5
  cancellationPollSeconds: 2
  # Created idempotently after each Helm install/upgrade. Partition counts can
  # only grow; drain tile work before increasing them because Kafka may remap
  # existing keys when new partitions are added.
  topics:
    - name: vols-bruts
      partitions: 1
    - name: images-ortho
      partitions: 1
    - name: pipeline-status
      partitions: 1
    - name: pipeline-control
      partitions: 1
    - name: image-tiles
      partitions: 4
    - name: tile-detections
      partitions: 4
    - name: pipeline-dead-letter
      partitions: 1
  persistence:
    enabled: true
    hostPath: ""
    storageClass: ""
    size: 10Gi

# --------------------------------------------------------------------------
# MinIO (local S3-compatible object storage — disabled in cloud)
# --------------------------------------------------------------------------
minio:
  enabled: true
  image: minio/minio:latest
  browserUploadCors:
    allowedOrigins:
      - "http://localhost:3000"
      - "http://127.0.0.1:3000"
  consoleNodePort: 30090
  apiNodePort: 30091
  persistence:
    hostPath: ""
    storageClass: ""
    size: 200Gi
  accessKey: minioadmin
  secretKey: minioadmin
  bucket: drone-ai

# --------------------------------------------------------------------------
# PostgreSQL + PostGIS (local — disabled in cloud, use managed DB)
# --------------------------------------------------------------------------
postgres:
  enabled: true
  image: postgis/postgis:16-3.5
  persistence:
    hostPath: ""
    storageClass: ""
    size: 20Gi
  database: droneai
  user: droneai
  password: droneai-local
  # Cloud deployments should reference a pre-created Secret. The inline
  # password remains only for local development compatibility.
  existingSecret: ""
  passwordSecretKey: password
  backup:
    enabled: false
    schedule: "17 2 * * *"
    timeZone: Etc/UTC
    prefix: postgres
    slots: 7
    existingSecret: ""
    accessKeySecretKey: s3-access-key
    secretKeySecretKey: s3-secret-key
    s3Endpoint: ""
    s3Bucket: ""
    s3Region: us-east-1
    awsCliImage: amazon/aws-cli:2.31.25@sha256:805953a28509a1445f9ef486ad64018c53dc0d960f63e113c2973f3f7613278c

# --------------------------------------------------------------------------
# Storage / Database connection strings (consumed by all services)
# --------------------------------------------------------------------------
storage:
  # Production must reference a pre-created Secret rather than storing
  # credentials in Helm values.
  existingSecret: ""
  accessKeySecretKey: s3-access-key
  secretKeySecretKey: s3-secret-key
  databaseUrlSecretKey: database-url
  s3Endpoint: "http://minio.drone-ai.svc:9000"
  s3PublicEndpoint: ""   # Set to browser-reachable MinIO URL; empty = auto-detect via apiNodePort
  s3Bucket: "drone-ai"
  s3AccessKey: "minioadmin"
  s3SecretKey: "minioadmin"
  s3Region: "us-east-1"
  databaseUrl: "postgresql://droneai:droneai-local@postgres.drone-ai.svc:5432/droneai"
  # External S3 buckets must expose ETag and allow PUT from the frontend
  # origin. See scripts/deploy/configure-s3-upload-cors.sh.

# --------------------------------------------------------------------------
# COLMAP Worker
# --------------------------------------------------------------------------
colmapWorker:
  enabled: true
  image: drone-colmap
  tag: latest
  gaussianBackend: dronegs
  resources:
    limits:
      nvidia.com/gpu: "1"
      memory: "80Gi"
    requests:
      memory: "80Gi"
  workVolume:
    sizeLimit: 100Gi
    persistentClaim:
      enabled: false
      name: drone-ai-colmap-work
      storageClass: ""
      size: 100Gi
    # Available work drives mounted into the pod.
    # The user picks one per-mission from the dashboard UI.
    # Supported sources:
    #   type: emptyDir
    #   hostPath: /existing/writable/directory
    #   existingClaim: existing-pvc-name
    drives:
      - name: system
        type: emptyDir
        label: "Ephemeral node workspace"
    default: system

# --------------------------------------------------------------------------
# IA Worker
# --------------------------------------------------------------------------
tileResults:
  # Shared producer/consumer bound for one versioned IA result artifact.
  maximumBytes: "10485760"

iaWorker:
  enabled: true
  replicaCount: 1
  image: drone-ia
  tag: latest
  resources:
    limits:
      nvidia.com/gpu: "1"
      memory: "8Gi"
    requests:
      memory: "2Gi"
  modelCache:
    # The same PVC stores Hugging Face assets and writable YOLO variants.
    # The image-baked, checksum-verified default remains under
    # /opt/modelzoo and is preferred until a cached override exists.
    hostPath: ""
    storageClass: ""
    # Use ReadWriteMany with a compatible storage class before scaling IA
    # workers across nodes. The default OVH Cinder volume is single-node.
    accessMode: ReadWriteOnce
    size: 30Gi
  sam3:
    repository: facebook/sam3
    # Immutable Hugging Face commit; updates must be explicit and reviewed.
    revision: 3c879f39826c281e95690f02c7821c4de09afae7

# --------------------------------------------------------------------------
# Processing Worker
# --------------------------------------------------------------------------
processingWorker:
  replicaCount: 1
  image: drone-processing
  tag: latest
  analysis:
    maximumTileAttempts: "5"
    finalizationLeaseSeconds: "1800"
    maximumAggregateResultBytes: "268435456"
    maximumRawDetections: "100000"
    maximumFinalDetections: "50000"
  # Bounds orthomosaic and JPEG tile workspaces even if process cleanup is
  # interrupted by a container or node failure.
  temporaryStorage:
    sizeLimit: "50Gi"
  resources:
    limits:
      memory: "16Gi"
    requests:
      memory: "4Gi"

# --------------------------------------------------------------------------
# Dashboard API
# --------------------------------------------------------------------------
dashboardApi:
  replicaCount: 1
  image: drone-dashboard-api
  tag: latest
  resources:
    limits:
      memory: "2Gi"
    requests:
      memory: "512Mi"
  service:
    type: NodePort
    nodePort: 30080
  cors:
    origins: "*"
  environment: development
  auth:
    disabled: true
    existingSecret: ""
    secretKey: api-keys.json
    sessionSecretKey: session-secret
    sessionMaxAgeSeconds: 28800
  uploads:
    # Strings prevent large byte counts from being rendered in scientific
    # notation by Helm/YAML before they reach the integer-only API parser.
    maxFiles: "2500"
    maxFileBytes: "2147483648"
    maxBatchBytes: "53687091200"
  tiles:
    # auto selects PostgreSQL in staging/production and local memory in dev.
    rateLimitBackend: auto
    rateLimitPerMinute: "600"
    rateLimitBurst: "120"
    rateLimitMaxClients: "10000"

# --------------------------------------------------------------------------
# Bounded stage Jobs (qualified; explicit immutable-map opt-in per environment)
# --------------------------------------------------------------------------
stageJobs:
  enabled: false
  # All five one-shot commands are implemented and Q3-qualified. Enabling still
  # requires every entry so a generic Helm install cannot dispatch mutable or
  # partially configured workloads. Images use an OCI digest or Git-SHA tag.
  executors: {}
  serviceAccountName: stage-job-sa
  activeDeadlineSeconds: 86400
  ttlSecondsAfterFinished: 3600
  scheduler:
    pollSeconds: 5
    globalConcurrency: 2
    perOwnerConcurrency: 1
    perMissionConcurrency: 1
    resourceConcurrency:
      cpu-standard: 2
      gpu-standard: 1
      gpu-geometry: 1
      gpu-high-memory: 1

# --------------------------------------------------------------------------
# Dashboard Frontend
# --------------------------------------------------------------------------
dashboardFrontend:
  image: drone-dashboard-frontend
  tag: latest
  # Empty keeps the local browser-hostname:30080 fallback. Set the public
  # HTTPS API origin when the frontend is served through an ingress.
  apiUrl: ""
  resources:
    limits:
      memory: "512Mi"
    requests:
      memory: "128Mi"
  service:
    type: NodePort
    nodePort: 30000

# --------------------------------------------------------------------------
# Ingress (disabled locally — enable in cloud values)
# --------------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
  # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts: []
  # - host: droneai.example.fr
  #   paths:
  #     - path: /
  #       service: dashboard-frontend
  # - host: api.droneai.example.fr
  #   paths:
  #     - path: /
  #       service: dashboard-api
  tls: []
  # - secretName: droneai-tls
  #   hosts:
  #     - droneai.example.fr
  #     - api.droneai.example.fr

# --------------------------------------------------------------------------
# GPU scheduling (no selectors for single-node local)
# --------------------------------------------------------------------------
gpu:
  # K3s creates this RuntimeClass automatically when
  # nvidia-container-runtime is installed before K3s starts. Bounded stage
  # Jobs apply it only to resource classes that request a GPU.
  runtimeClassName: nvidia
  nodeSelector: {}
  tolerations: []

# --------------------------------------------------------------------------
# HuggingFace token (must exist as K8s secret before install)
# --------------------------------------------------------------------------
hfToken:
  existingSecret: hf-token
  secretKey: HF_TOKEN
