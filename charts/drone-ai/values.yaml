# ==========================================================================
# DroneAI Helm values — portable K3s/Kubernetes defaults
# Host paths are intentionally empty: deploy.sh discovers/configures local
# storage, while cloud installations should use PVC-backed storage.
# ==========================================================================

global:
  namespace: drone-ai
  createNamespace: true
  imageRegistry: ""          # empty = local images (docker save → k3s ctr import)
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  # Production overlays enable this guard so mutable application tags cannot
  # be rendered accidentally. Local/K3s development keeps latest support.
  requireImmutableImages: false

observability:
  alerts:
    # Requires the Prometheus Operator CRDs in the target cluster.
    enabled: false
    httpErrorRatio: 0.05
    httpP95Seconds: 2
    outboxAgeSeconds: 300
    stageQueueAgeSeconds: 600
    kafkaLagRecords: 1000


# --------------------------------------------------------------------------
# Application NetworkPolicy (portable L3/L4 baseline)
# --------------------------------------------------------------------------
networkPolicy:
  # Protected overlays enable this. It targets only DroneAI application and
  # Stage Job pods; stateful dependencies keep their chart/service policies.
  enabled: false
  ingressNamespace: ingress-nginx
  monitoringNamespace: monitoring

# --------------------------------------------------------------------------
# Kafka
# --------------------------------------------------------------------------
kafka:
  enabled: true
  # Empty selects the in-chart Service. Set a host:port here when migrating to
  # an external Kafka service.
  broker: ""
  image: apache/kafka:3.7.0
  clusterId: "droneai-local-cluster-001"
  cancellationPollSeconds: 2
  # Created idempotently after each Helm install/upgrade. Partition counts can
  # only grow; drain control traffic before increasing them because Kafka may
  # remap existing keys when new partitions are added.
  topics:
    - name: pipeline-status
      partitions: 1
    - name: pipeline-control
      partitions: 1
    - name: pipeline-dead-letter
      partitions: 1
  persistence:
    enabled: true
    hostPath: ""
    storageClass: ""
    size: 10Gi

# --------------------------------------------------------------------------
# MinIO (local S3-compatible object storage — disabled in cloud)
# --------------------------------------------------------------------------
minio:
  enabled: true
  image: minio/minio:latest
  browserUploadCors:
    allowedOrigins:
      - "http://localhost:3000"
      - "http://127.0.0.1:3000"
  consoleNodePort: 30090
  apiNodePort: 30091
  persistence:
    hostPath: ""
    storageClass: ""
    size: 200Gi
  accessKey: minioadmin
  secretKey: minioadmin
  bucket: drone-ai

# --------------------------------------------------------------------------
# PostgreSQL + PostGIS (local — disabled in cloud, use managed DB)
# --------------------------------------------------------------------------
postgres:
  enabled: true
  image: postgis/postgis:16-3.5
  persistence:
    hostPath: ""
    storageClass: ""
    size: 20Gi
  database: droneai
  user: droneai
  password: droneai-local
  # Cloud deployments should reference a pre-created Secret. The inline
  # password remains only for local development compatibility.
  existingSecret: ""
  passwordSecretKey: password
  backup:
    enabled: false
    schedule: "17 2 * * *"
    timeZone: Etc/UTC
    prefix: postgres
    slots: 7
    existingSecret: ""
    accessKeySecretKey: s3-access-key
    secretKeySecretKey: s3-secret-key
    s3Endpoint: ""
    s3Bucket: ""
    s3Region: us-east-1
    awsCliImage: amazon/aws-cli:2.31.25@sha256:805953a28509a1445f9ef486ad64018c53dc0d960f63e113c2973f3f7613278c

# --------------------------------------------------------------------------
# Storage / Database connection strings (consumed by all services)
# --------------------------------------------------------------------------
storage:
  # Production must reference a pre-created Secret rather than storing
  # credentials in Helm values.
  existingSecret: ""
  accessKeySecretKey: s3-access-key
  secretKeySecretKey: s3-secret-key
  databaseUrlSecretKey: database-url
  s3Endpoint: "http://minio.drone-ai.svc:9000"
  s3PublicEndpoint: ""   # Set to browser-reachable MinIO URL; empty = auto-detect via apiNodePort
  s3Bucket: "drone-ai"
  s3AccessKey: "minioadmin"
  s3SecretKey: "minioadmin"
  s3Region: "us-east-1"
  databaseUrl: "postgresql://droneai:droneai-local@postgres.drone-ai.svc:5432/droneai"
  # External S3 buckets must expose ETag/Range headers and allow browser PUT,
  # GET and HEAD from the frontend origin. See the CORS deployment helper.

# --------------------------------------------------------------------------
# COLMAP Worker
# --------------------------------------------------------------------------
colmapWorker:
  enabled: false
  # Workspace configuration for Stage Jobs.
  workVolume:
    sizeLimit: 100Gi
    persistentClaim:
      enabled: false
      name: drone-ai-colmap-work
      storageClass: ""
      size: 100Gi
    # Available work drives mounted into the pod.
    # The user picks one per-mission from the dashboard UI.
    # Supported sources:
    #   type: emptyDir
    #   hostPath: /existing/writable/directory
    #   existingClaim: existing-pvc-name
    drives:
      - name: system
        type: emptyDir
        label: "Ephemeral node workspace"
    default: system

# --------------------------------------------------------------------------
# Dashboard API
# --------------------------------------------------------------------------
dashboardApi:
  replicaCount: 1
  image: drone-dashboard-api
  tag: latest
  # Expose internal quality-profile candidates in the operator catalog only
  # during a controlled qualification. Public profiles do not need this flag.
  # Local development may reuse database-url. Protected environments must use
  # a separate Secret key whose URL authenticates as a non-owner, NOBYPASSRLS
  # PostgreSQL role.
  databaseUrlSecretKey: database-url
  rowLevelSecurityRequired: false
  observability:
    # Dedicated pod-local Prometheus endpoint; never routed through ingress.
    metricsEnabled: false
    metricsPort: 9100
  controlWorker:
    # Durable outbox delivery, upload reconciliation, and stage scheduling run
    # outside the request-serving API so API rollouts cannot stop control work.
    enabled: true
    replicaCount: 1
    leaderElection:
      # Protected overlays enable PostgreSQL advisory leadership and run two
      # replicas. Local single-process development can keep it disabled.
      enabled: false
      pollSeconds: 2
    # Must exceed the leadership poll interval plus normal scheduler jitter.
    healthMaxAgeSeconds: "15"
    resources:
      limits:
        memory: "1Gi"
      requests:
        memory: "256Mi"
  resources:
    limits:
      memory: "2Gi"
    requests:
      memory: "512Mi"
  service:
    type: NodePort
    nodePort: 30080
  cors:
    origins: "*"
  environment: development
  proxy:
    # Uvicorn accepts forwarded client/protocol headers only from these direct
    # peers. Protected overlays must replace this with the actual ingress/LB
    # source CIDRs; wildcard and internet-wide networks are rejected.
    trustedCidrs: "127.0.0.1"
  auth:
    disabled: true
    databaseAuthEnabled: false
    # Transitional local/development registry. Protected deployments should
    # disable it after issuing the first durable administrator credential.
    allowStaticBootstrap: true
    # auto selects PostgreSQL in staging/production and local memory in dev.
    # The peer bucket limits rotating identifiers; the credential bucket
    # limits targeted attempts against one public credential UUID.
    rateLimitBackend: auto
    peerRateLimitPerMinute: "600"
    peerRateLimitBurst: "120"
    credentialRateLimitPerMinute: "60"
    credentialRateLimitBurst: "10"
    rateLimitMaxClients: "100000"
    existingSecret: ""
    secretKey: api-keys.json
    sessionSecretKey: session-secret
    # Optional JSON {"current":"kid","keys":{"kid":"secret",...}}.
    # Keep no more than five keys and remove previous keys after max session age.
    sessionSigningKeysSecretKey: session-signing-keys.json
    credentialPepperSecretKey: credential-pepper
    sessionMaxAgeSeconds: 28800
  http:
    # Large imagery is uploaded directly to S3; API control requests stay small.
    maxBodyBytes: "2097152"
  uploads:
    # Strings prevent large byte counts from being rendered in scientific
    # notation by Helm/YAML before they reach the integer-only API parser.
    maxFiles: "2500"
    maxFileBytes: "2147483648"
    maxBatchBytes: "53687091200"
  saas:
    # Organization policies are provisioned through the operator-only CLI.
    # Protected overlays enable the shared database request token bucket.
    organizationRequestQuotasEnabled: false
    retentionCleanupSeconds: "900"
    retentionFailureRetrySeconds: "3600"
  tiles:
    # auto selects PostgreSQL in staging/production and local memory in dev.
    rateLimitBackend: auto
    rateLimitPerMinute: "600"
    rateLimitBurst: "120"
    rateLimitMaxClients: "10000"

# --------------------------------------------------------------------------
# Bounded stage Jobs (qualified; explicit immutable-map opt-in per environment)
# --------------------------------------------------------------------------
stageJobs:
  sam3:
    repository: facebook/sam3
    # Immutable model revision shared by monolithic and sharded detection Jobs.
    revision: 3c879f39826c281e95690f02c7821c4de09afae7
  enabled: false
  # Each stage Secret must expose a PostgreSQL URL for a non-owner,
  # NOBYPASSRLS executor role under this key. The generated development Secret
  # aliases the operator URL for local compatibility only.
  databaseUrlSecretKey: stage-database-url
  # Existing Secrets injected into each one-shot executor. Each Secret exposes
  # stage-database-url, s3-access-key and s3-secret-key. A complete map with
  # six distinct Secret names is
  # mandatory when Jobs are enabled in staging or production. Development may
  # omit it and reuse storage.existingSecret for local compatibility only.
  credentialSecrets: {}
  # Stage workspaces always use organization-scoped Artifact Manifest v3.
  # Detection-only canary: materialize its declared orthomosaic instead of the
  # complete parent overlay.
  artifactSelectiveRestoreEnabled: false
  # Full-raster fan-out/fan-in remains a separate canary. Small rasters stay
  # monolithic; larger plans use an Indexed Job and a distinct finalizer Job.
  # Requires artifactSelectiveRestoreEnabled=true.
  detectionFanout:
    enabled: false
    tilesPerShard: 1024
    parallelism: 2
    maximumTiles: 100000
  # All six one-shot commands are implemented and Q3-qualified. Enabling still
  # requires every entry so a generic Helm install cannot dispatch mutable or
  # partially configured workloads. Protected environments require an OCI
  # digest; development may use a Git-SHA tag for local scientific workflows.
  # A tag remains mutable at the registry boundary and is never a production
  # promotion identity.
  # Entries may add node_selector pairs and narrowly scoped tolerations. GPU
  # presence and minimum-VRAM selectors are derived from the resource class and
  # cannot be weakened by an executor override.
  executors: {}
  serviceAccountName: stage-job-sa
  activeDeadlineSeconds: 86400
  ttlSecondsAfterFinished: 3600
  scheduler:
    pollSeconds: 5
    # Global and resource-class limits count physical pod units. Per-owner
    # (organization) and per-mission limits count logical stage runs.
    globalConcurrency: 2
    perOwnerConcurrency: 1
    perMissionConcurrency: 1
    resourceConcurrency:
      cpu-standard: 2
      cpu-high-memory: 1
      gpu-standard: 1
      gpu-geometry: 1
      gpu-high-memory: 1

# --------------------------------------------------------------------------
# Dashboard Frontend
# --------------------------------------------------------------------------
dashboardFrontend:
  image: drone-dashboard-frontend
  tag: latest
  # Empty keeps the local browser-hostname:30080 fallback. Set the public
  # HTTPS API origin when the frontend is served through an ingress.
  apiUrl: ""
  resources:
    limits:
      memory: "512Mi"
    requests:
      memory: "128Mi"
  service:
    type: NodePort
    nodePort: 30000

# --------------------------------------------------------------------------
# Ingress (disabled locally — enable in cloud values)
# --------------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
  # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts: []
  # - host: droneai.example.fr
  #   paths:
  #     - path: /
  #       service: dashboard-frontend
  # - host: api.droneai.example.fr
  #   paths:
  #     - path: /
  #       service: dashboard-api
  tls: []
  # - secretName: droneai-tls
  #   hosts:
  #     - droneai.example.fr
  #     - api.droneai.example.fr

# --------------------------------------------------------------------------
# GPU scheduling (no selectors for single-node local)
# --------------------------------------------------------------------------
gpu:
  # K3s creates this RuntimeClass automatically when
  # nvidia-container-runtime is installed before K3s starts. Bounded stage
  # Jobs apply it only to resource classes that request a GPU.
  runtimeClassName: nvidia
  nodeSelector: {}
  tolerations: []

# --------------------------------------------------------------------------
# HuggingFace token (must exist as K8s secret before install)
# --------------------------------------------------------------------------
hfToken:
  existingSecret: hf-token
  secretKey: HF_TOKEN
