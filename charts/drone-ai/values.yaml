# ==========================================================================
# DroneAI Helm values — LOCAL K3s defaults
# For cloud, override with:  helm install -f values-cloud.yaml ...
# ==========================================================================

global:
  namespace: drone-ai
  imageRegistry: ""          # empty = local images (docker save → k3s ctr import)
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

# --------------------------------------------------------------------------
# Kafka
# --------------------------------------------------------------------------
kafka:
  enabled: true
  image: apache/kafka:3.7.0
  clusterId: "droneai-local-cluster-001"
  persistence:
    enabled: true
    hostPath: /mnt/j/droneAI_workspace/kafka-data   # local only; remove for cloud
    storageClass: ""                                 # set to cloud class (e.g. "gp3") when hostPath is removed
    size: 10Gi

# --------------------------------------------------------------------------
# MinIO (local S3-compatible object storage — disabled in cloud)
# --------------------------------------------------------------------------
minio:
  enabled: true
  image: minio/minio:latest
  consoleNodePort: 30090
  apiNodePort: 30091
  persistence:
    hostPath: /mnt/j/droneAI_workspace/minio-data   # local only; remove for cloud
    storageClass: ""                                 # set to cloud class when hostPath is removed
    size: 200Gi
  accessKey: minioadmin
  secretKey: minioadmin
  bucket: drone-ai

# --------------------------------------------------------------------------
# PostgreSQL + PostGIS (local — disabled in cloud, use managed DB)
# --------------------------------------------------------------------------
postgres:
  enabled: true
  image: postgis/postgis:16-3.5
  persistence:
    hostPath: /var/lib/droneai/postgres-data         # local only; remove for cloud
    storageClass: ""                                 # set to cloud class when hostPath is removed
    size: 20Gi
  database: droneai
  user: droneai
  password: droneai-local

# --------------------------------------------------------------------------
# Storage / Database connection strings (consumed by all services)
# --------------------------------------------------------------------------
storage:
  # Production must reference a pre-created Secret rather than storing
  # credentials in Helm values.
  existingSecret: ""
  accessKeySecretKey: s3-access-key
  secretKeySecretKey: s3-secret-key
  databaseUrlSecretKey: database-url
  s3Endpoint: "http://minio.drone-ai.svc:9000"
  s3PublicEndpoint: ""   # Set to browser-reachable MinIO URL; empty = auto-detect via apiNodePort
  s3Bucket: "drone-ai"
  s3AccessKey: "minioadmin"
  s3SecretKey: "minioadmin"
  s3Region: "us-east-1"
  databaseUrl: "postgresql://droneai:droneai-local@postgres.drone-ai.svc:5432/droneai"

# --------------------------------------------------------------------------
# COLMAP Worker
# --------------------------------------------------------------------------
colmapWorker:
  image: drone-colmap
  tag: latest
  gaussianBackend: dronegs
  resources:
    limits:
      nvidia.com/gpu: "1"
      memory: "80Gi"
    requests:
      memory: "80Gi"
  workVolume:
    sizeLimit: 100Gi
    # Available work drives mounted into the pod.
    # The user picks one per-mission from the dashboard UI.
    drives:
      - name: system
        hostPath: ""          # emptyDir on root disk (fast but limited)
        label: "System SSD (fast, limited)"
      - name: drive-i
        hostPath: /mnt/i/droneAI_workspace/colmap-work
        label: "Drive I: (1.9 TB HDD)"
      - name: drive-j
        hostPath: /mnt/j/droneAI_workspace/colmap-work
        label: "Drive J: (1.9 TB HDD)"
    default: drive-i

# --------------------------------------------------------------------------
# IA Worker
# --------------------------------------------------------------------------
iaWorker:
  image: drone-ia
  tag: latest
  resources:
    limits:
      nvidia.com/gpu: "1"
      memory: "8Gi"
    requests:
      memory: "2Gi"
  modelCache:
    hostPath: /mnt/j/droneAI_workspace/model-cache   # local only; remove for cloud
    storageClass: ""                                  # set to cloud class when hostPath is removed
    size: 30Gi

# --------------------------------------------------------------------------
# Processing Worker
# --------------------------------------------------------------------------
processingWorker:
  image: drone-processing
  tag: latest
  resources:
    limits:
      memory: "16Gi"
    requests:
      memory: "4Gi"

# --------------------------------------------------------------------------
# Dashboard API
# --------------------------------------------------------------------------
dashboardApi:
  image: drone-dashboard-api
  tag: latest
  resources:
    limits:
      memory: "2Gi"
    requests:
      memory: "512Mi"
  service:
    type: NodePort
    nodePort: 30080
  cors:
    origins: "*"
  environment: development
  auth:
    disabled: true
    existingSecret: ""
    secretKey: api-keys.json
    sessionSecretKey: session-secret
    sessionMaxAgeSeconds: 28800
  uploads:
    maxFiles: 2500
    maxFileBytes: 2147483648
    maxBatchBytes: 53687091200

# --------------------------------------------------------------------------
# Dashboard Frontend
# --------------------------------------------------------------------------
dashboardFrontend:
  image: drone-dashboard-frontend
  tag: latest
  # Empty keeps the local browser-hostname:30080 fallback. Set the public
  # HTTPS API origin when the frontend is served through an ingress.
  apiUrl: ""
  resources:
    limits:
      memory: "512Mi"
    requests:
      memory: "128Mi"
  service:
    type: NodePort
    nodePort: 30000

# --------------------------------------------------------------------------
# Ingress (disabled locally — enable in cloud values)
# --------------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
  # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts: []
  # - host: droneai.example.fr
  #   paths:
  #     - path: /
  #       service: dashboard-frontend
  # - host: api.droneai.example.fr
  #   paths:
  #     - path: /
  #       service: dashboard-api
  tls: []
  # - secretName: droneai-tls
  #   hosts:
  #     - droneai.example.fr
  #     - api.droneai.example.fr

# --------------------------------------------------------------------------
# GPU scheduling (no selectors for single-node local)
# --------------------------------------------------------------------------
gpu:
  nodeSelector: {}
  tolerations: []

# --------------------------------------------------------------------------
# HuggingFace token (must exist as K8s secret before install)
# --------------------------------------------------------------------------
hfToken:
  existingSecret: hf-token
  secretKey: HF_TOKEN
