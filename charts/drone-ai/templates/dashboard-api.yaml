# --- ServiceAccount ---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-api-sa
  namespace: {{ include "drone-ai.namespace" . }}
  labels:
    {{- include "drone-ai.labels" . | nindent 4 }}
---
# --- Role: read pods ---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dashboard-api-pod-reader
  namespace: {{ include "drone-ai.namespace" . }}
  labels:
    {{- include "drone-ai.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
{{- if .Values.stageJobs.enabled }}
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "get", "list", "watch", "delete"]
{{- end }}
---
# --- RoleBinding ---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-api-pod-reader-binding
  namespace: {{ include "drone-ai.namespace" . }}
  labels:
    {{- include "drone-ai.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: dashboard-api-sa
  namespace: {{ include "drone-ai.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dashboard-api-pod-reader
{{- if .Values.stageJobs.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.stageJobs.serviceAccountName }}
  namespace: {{ include "drone-ai.namespace" . }}
  labels:
    {{- include "drone-ai.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
---
# --- Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-api
  namespace: {{ include "drone-ai.namespace" . }}
  labels:
    {{- include "drone-ai.labels" . | nindent 4 }}
    app: dashboard-api
spec:
  replicas: {{ .Values.dashboardApi.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: dashboard-api
  template:
    metadata:
      labels:
        app: dashboard-api
    spec:
      serviceAccountName: dashboard-api-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
      - name: wait-for-schema
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        image: {{ include "drone-ai.image" (dict "root" . "image" .Values.dashboardApi.image "tag" .Values.dashboardApi.tag) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        command: ["/bin/sh", "-c"]
        args:
        - until cd /app && alembic current 2>/dev/null | grep -q "(head)"; do sleep 2; done
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "drone-ai.storageSecretName" . }}
              key: {{ .Values.storage.databaseUrlSecretKey }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      containers:
      - name: api
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        image: {{ include "drone-ai.image" (dict "root" . "image" .Values.dashboardApi.image "tag" .Values.dashboardApi.tag) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        env:
        {{- include "drone-ai.commonEnv" . | nindent 8 }}
        - name: CORS_ORIGINS
          value: {{ .Values.dashboardApi.cors.origins | quote }}
        - name: DRONEAI_ENV
          value: {{ .Values.dashboardApi.environment | quote }}
        - name: DRONEAI_AUTH_DISABLED
          value: {{ .Values.dashboardApi.auth.disabled | quote }}
        - name: DRONEAI_SESSION_MAX_AGE_SECONDS
          value: {{ .Values.dashboardApi.auth.sessionMaxAgeSeconds | quote }}
        {{- if .Values.dashboardApi.auth.existingSecret }}
        - name: DRONEAI_API_KEYS_JSON
          valueFrom:
            secretKeyRef:
              name: {{ .Values.dashboardApi.auth.existingSecret }}
              key: {{ .Values.dashboardApi.auth.secretKey }}
        - name: DRONEAI_SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.dashboardApi.auth.existingSecret }}
              key: {{ .Values.dashboardApi.auth.sessionSecretKey }}
        {{- end }}
        - name: DRONEAI_UPLOAD_MAX_FILES
          value: {{ .Values.dashboardApi.uploads.maxFiles | quote }}
        - name: DRONEAI_UPLOAD_MAX_FILE_BYTES
          value: {{ .Values.dashboardApi.uploads.maxFileBytes | quote }}
        - name: DRONEAI_UPLOAD_MAX_BATCH_BYTES
          value: {{ .Values.dashboardApi.uploads.maxBatchBytes | quote }}
        - name: DRONEAI_TILE_RATE_LIMIT_PER_MINUTE
          value: {{ .Values.dashboardApi.tiles.rateLimitPerMinute | quote }}
        - name: DRONEAI_TILE_RATE_LIMIT_BACKEND
          value: {{ .Values.dashboardApi.tiles.rateLimitBackend | quote }}
        - name: DRONEAI_TILE_RATE_LIMIT_BURST
          value: {{ .Values.dashboardApi.tiles.rateLimitBurst | quote }}
        - name: DRONEAI_TILE_RATE_LIMIT_MAX_CLIENTS
          value: {{ .Values.dashboardApi.tiles.rateLimitMaxClients | quote }}
        - name: DRONEAI_STAGE_JOBS_ENABLED
          value: {{ .Values.stageJobs.enabled | quote }}
        - name: DRONEAI_ARTIFACT_MANIFEST_V2_WRITE_ENABLED
          value: {{ .Values.stageJobs.artifactManifestV2WriteEnabled | quote }}
        - name: DRONEAI_STAGE_SCHEDULER_POLL_SECONDS
          value: {{ .Values.stageJobs.scheduler.pollSeconds | quote }}
        - name: DRONEAI_STAGE_GLOBAL_CONCURRENCY
          value: {{ .Values.stageJobs.scheduler.globalConcurrency | quote }}
        - name: DRONEAI_STAGE_OWNER_CONCURRENCY
          value: {{ .Values.stageJobs.scheduler.perOwnerConcurrency | quote }}
        - name: DRONEAI_STAGE_MISSION_CONCURRENCY
          value: {{ .Values.stageJobs.scheduler.perMissionConcurrency | quote }}
        - name: DRONEAI_STAGE_RESOURCE_CONCURRENCY_JSON
          value: {{ .Values.stageJobs.scheduler.resourceConcurrency | toJson | quote }}
        - name: DRONEAI_STAGE_EXECUTORS_JSON
          value: {{ .Values.stageJobs.executors | toJson | quote }}
        - name: DRONEAI_STAGE_JOB_SERVICE_ACCOUNT
          value: {{ .Values.stageJobs.serviceAccountName | quote }}
        - name: DRONEAI_STAGE_JOB_ACTIVE_DEADLINE_SECONDS
          value: {{ .Values.stageJobs.activeDeadlineSeconds | quote }}
        - name: DRONEAI_STAGE_JOB_TTL_SECONDS_AFTER_FINISHED
          value: {{ .Values.stageJobs.ttlSecondsAfterFinished | quote }}
        - name: DRONEAI_STAGE_JOB_RUNTIME_CLASS
          value: {{ .Values.gpu.runtimeClassName | quote }}
        - name: DRONEAI_STAGE_HF_TOKEN_SECRET_NAME
          value: {{ .Values.hfToken.existingSecret | quote }}
        - name: DRONEAI_STAGE_HF_TOKEN_SECRET_KEY
          value: {{ .Values.hfToken.secretKey | quote }}
        - name: DRONEAI_STAGE_SAM3_MODEL_ID
          value: {{ .Values.iaWorker.sam3.repository | quote }}
        - name: DRONEAI_STAGE_SAM3_MODEL_REVISION
          value: {{ .Values.iaWorker.sam3.revision | quote }}
        - name: DRONEAI_STAGE_STORAGE_SECRET_NAME
          value: {{ include "drone-ai.storageSecretName" . | quote }}
        - name: DRONEAI_STAGE_DATABASE_URL_SECRET_KEY
          value: {{ .Values.storage.databaseUrlSecretKey | quote }}
        - name: DRONEAI_STAGE_S3_ACCESS_KEY_SECRET_KEY
          value: {{ .Values.storage.accessKeySecretKey | quote }}
        - name: DRONEAI_STAGE_S3_SECRET_KEY_SECRET_KEY
          value: {{ .Values.storage.secretKeySecretKey | quote }}
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: WORK_DRIVES
          value: {{ include "colmap.workDrivesJson" . | quote }}
        - name: WORK_DRIVE_DEFAULT
          value: {{ .Values.colmapWorker.workVolume.default | quote }}
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
        resources:
          {{- toYaml .Values.dashboardApi.resources | nindent 10 }}
      volumes:
      - name: tmp
        emptyDir: {}
---
# --- Service ---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-api-service
  namespace: {{ include "drone-ai.namespace" . }}
  labels:
    {{- include "drone-ai.labels" . | nindent 4 }}
    app: dashboard-api
spec:
  type: {{ .Values.dashboardApi.service.type }}
  selector:
    app: dashboard-api
  ports:
  - port: 8000
    targetPort: 8000
    {{- if eq .Values.dashboardApi.service.type "NodePort" }}
    nodePort: {{ .Values.dashboardApi.service.nodePort }}
    {{- end }}
