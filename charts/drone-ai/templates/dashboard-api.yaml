{{- if and .Values.stageJobs.artifactSelectiveRestoreEnabled (not .Values.stageJobs.artifactManifestV2WriteEnabled) }}
{{- fail "stageJobs.artifactSelectiveRestoreEnabled requires stageJobs.artifactManifestV2WriteEnabled=true" }}
{{- end }}
{{- if and .Values.stageJobs.detectionFanout.enabled (not .Values.stageJobs.artifactSelectiveRestoreEnabled) }}
{{- fail "stageJobs.detectionFanout.enabled requires stageJobs.artifactSelectiveRestoreEnabled=true" }}
{{- end }}
{{- $protectedStageJobEnvironment := or (eq .Values.dashboardApi.environment "staging") (eq .Values.dashboardApi.environment "production") }}
{{- if and $protectedStageJobEnvironment (not .Values.dashboardApi.rowLevelSecurityRequired) }}
{{- fail "dashboardApi.rowLevelSecurityRequired must be true in staging and production" }}
{{- end }}
{{- if and $protectedStageJobEnvironment (not .Values.dashboardApi.saas.organizationRequestQuotasEnabled) }}
{{- fail "dashboardApi.saas.organizationRequestQuotasEnabled must be true in staging and production" }}
{{- end }}
{{- if and $protectedStageJobEnvironment (not .Values.dashboardApi.observability.metricsEnabled) }}
{{- fail "dashboardApi.observability.metricsEnabled must be true in staging and production" }}
{{- end }}
{{- if and $protectedStageJobEnvironment (not .Values.storage.existingSecret) }}
{{- fail "storage.existingSecret is required in staging and production" }}
{{- end }}
{{- if and $protectedStageJobEnvironment (eq .Values.dashboardApi.databaseUrlSecretKey .Values.storage.databaseUrlSecretKey) }}
{{- fail "dashboardApi.databaseUrlSecretKey must use a distinct non-owner PostgreSQL role in staging and production" }}
{{- end }}
{{- if and $protectedStageJobEnvironment (not .Values.dashboardApi.controlWorker.enabled) }}
{{- fail "dashboardApi.controlWorker.enabled must remain true when the HTTP API uses an RLS database role" }}
{{- end }}
{{- if and $protectedStageJobEnvironment (lt (int .Values.dashboardApi.controlWorker.replicaCount) 2) }}
{{- fail "dashboardApi.controlWorker.replicaCount must be at least 2 in staging and production" }}
{{- end }}
{{- if and $protectedStageJobEnvironment (not .Values.dashboardApi.controlWorker.leaderElection.enabled) }}
{{- fail "dashboardApi.controlWorker.leaderElection.enabled must be true in staging and production" }}
{{- end }}
{{- if and $protectedStageJobEnvironment (not .Values.stageJobs.enabled) }}
{{- fail "stageJobs.enabled must be true in staging and production; fused Kafka compute is development-only" }}
{{- end }}
{{- if and $protectedStageJobEnvironment .Values.colmapWorker.enabled }}
{{- fail "colmapWorker.enabled must be false in staging and production; use bounded stage Jobs" }}
{{- end }}
{{- if and $protectedStageJobEnvironment .Values.iaWorker.enabled }}
{{- fail "iaWorker.enabled must be false in staging and production; use bounded stage Jobs" }}
{{- end }}
{{- if and $protectedStageJobEnvironment (gt (int .Values.processingWorker.replicaCount) 0) }}
{{- fail "processingWorker.replicaCount must be 0 in staging and production; use bounded stage Jobs" }}
{{- end }}
{{- if and .Values.stageJobs.enabled $protectedStageJobEnvironment }}
{{- if eq .Values.stageJobs.databaseUrlSecretKey .Values.storage.databaseUrlSecretKey }}
{{- fail "stageJobs.databaseUrlSecretKey must identify a non-owner PostgreSQL role distinct from the operator role in staging and production" }}
{{- end }}
{{- $seenCredentialSecrets := dict }}
{{- range $stage := list "reconstruction" "gaussian_training" "gaussian_filtering" "rasterization" "detection" "gaussian_viewer" }}
{{- $secretName := index $.Values.stageJobs.credentialSecrets $stage | default "" }}
{{- if not $secretName }}
{{- fail (printf "stageJobs.credentialSecrets.%s is required when stage Jobs are enabled in %s" $stage $.Values.dashboardApi.environment) }}
{{- end }}
{{- if hasKey $seenCredentialSecrets $secretName }}
{{- fail "stageJobs.credentialSecrets must use one distinct Secret per stage" }}
{{- end }}
{{- $_ := set $seenCredentialSecrets $secretName true }}
{{- $executor := index $.Values.stageJobs.executors $stage | default dict }}
{{- $executorImage := get $executor "image" | default "" }}
{{- if not $executorImage }}
{{- fail (printf "stageJobs.executors.%s.image is required in %s" $stage $.Values.dashboardApi.environment) }}
{{- end }}
{{- if not (regexMatch "@sha256:[0-9a-f]{64}$" $executorImage) }}
{{- fail (printf "stageJobs.executors.%s.image must use an OCI digest" $stage) }}
{{- end }}
{{- $executorCommand := get $executor "command" | default list }}
{{- if not $executorCommand }}
{{- fail (printf "stageJobs.executors.%s.command is required in %s" $stage $.Values.dashboardApi.environment) }}
{{- end }}
{{- if and (ne $stage "rasterization") (ne $stage "gaussian_viewer") (not (get $executor "gpu_architecture")) }}
{{- fail (printf "stageJobs.executors.%s.gpu_architecture is required in %s" $stage $.Values.dashboardApi.environment) }}
{{- end }}
{{- end }}
{{- end }}
# --- ServiceAccount ---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-api-sa
  namespace: {{ include "drone-ai.namespace" . }}
  labels:
    {{- include "drone-ai.labels" . | nindent 4 }}
{{- if and .Values.stageJobs.enabled (not .Values.dashboardApi.controlWorker.enabled) }}
---
# --- Role: embedded development Job controller ---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dashboard-api-job-controller
  namespace: {{ include "drone-ai.namespace" . }}
  labels:
    {{- include "drone-ai.labels" . | nindent 4 }}
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "get", "list", "watch", "delete"]
---
# --- RoleBinding ---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-api-job-controller-binding
  namespace: {{ include "drone-ai.namespace" . }}
  labels:
    {{- include "drone-ai.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: dashboard-api-sa
  namespace: {{ include "drone-ai.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dashboard-api-job-controller
{{- end }}
{{- if .Values.stageJobs.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.stageJobs.serviceAccountName }}
  namespace: {{ include "drone-ai.namespace" . }}
  labels:
    {{- include "drone-ai.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
---
# --- Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-api
  namespace: {{ include "drone-ai.namespace" . }}
  labels:
    {{- include "drone-ai.labels" . | nindent 4 }}
    app: dashboard-api
spec:
  replicas: {{ .Values.dashboardApi.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: dashboard-api
  template:
    metadata:
      labels:
        app: dashboard-api
      {{- if .Values.dashboardApi.observability.metricsEnabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: {{ .Values.dashboardApi.observability.metricsPort | quote }}
      {{- end }}
    spec:
      serviceAccountName: dashboard-api-sa
      automountServiceAccountToken: {{ and .Values.stageJobs.enabled (not .Values.dashboardApi.controlWorker.enabled) }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
      - name: wait-for-schema
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        image: {{ include "drone-ai.image" (dict "root" . "image" .Values.dashboardApi.image "tag" .Values.dashboardApi.tag) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        command: ["/bin/sh", "-c"]
        args:
        - until cd /app && alembic current 2>/dev/null | grep -q "(head)"; do sleep 2; done
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "drone-ai.storageSecretName" . }}
              key: {{ .Values.dashboardApi.databaseUrlSecretKey }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      containers:
      - name: api
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        image: {{ include "drone-ai.image" (dict "root" . "image" .Values.dashboardApi.image "tag" .Values.dashboardApi.tag) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        env:
        {{- include "drone-ai.commonEnv" (dict "root" . "databaseUrlSecretKey" .Values.dashboardApi.databaseUrlSecretKey) | nindent 8 }}
        - name: CORS_ORIGINS
          value: {{ .Values.dashboardApi.cors.origins | quote }}
        - name: DRONEAI_EMBED_CONTROL_LOOPS
          value: {{ (not .Values.dashboardApi.controlWorker.enabled) | quote }}
        - name: DRONEAI_QUALITY_PROFILE_CANDIDATES_ENABLED
          value: {{ .Values.dashboardApi.qualityProfileCandidatesEnabled | quote }}
        - name: DRONEAI_AUTH_DISABLED
          value: {{ .Values.dashboardApi.auth.disabled | quote }}
        - name: DRONEAI_DATABASE_AUTH_ENABLED
          value: {{ .Values.dashboardApi.auth.databaseAuthEnabled | quote }}
        - name: DRONEAI_ALLOW_STATIC_BOOTSTRAP
          value: {{ .Values.dashboardApi.auth.allowStaticBootstrap | quote }}
        - name: DRONEAI_IDENTITY_RATE_LIMIT_BACKEND
          value: {{ .Values.dashboardApi.auth.rateLimitBackend | quote }}
        - name: DRONEAI_IDENTITY_PEER_RATE_LIMIT_PER_MINUTE
          value: {{ .Values.dashboardApi.auth.peerRateLimitPerMinute | quote }}
        - name: DRONEAI_IDENTITY_PEER_RATE_LIMIT_BURST
          value: {{ .Values.dashboardApi.auth.peerRateLimitBurst | quote }}
        - name: DRONEAI_IDENTITY_CREDENTIAL_RATE_LIMIT_PER_MINUTE
          value: {{ .Values.dashboardApi.auth.credentialRateLimitPerMinute | quote }}
        - name: DRONEAI_IDENTITY_CREDENTIAL_RATE_LIMIT_BURST
          value: {{ .Values.dashboardApi.auth.credentialRateLimitBurst | quote }}
        - name: DRONEAI_IDENTITY_RATE_LIMIT_MAX_CLIENTS
          value: {{ .Values.dashboardApi.auth.rateLimitMaxClients | quote }}
        - name: DRONEAI_RLS_REQUIRED
          value: {{ .Values.dashboardApi.rowLevelSecurityRequired | quote }}
        - name: DRONEAI_METRICS_ENABLED
          value: {{ .Values.dashboardApi.observability.metricsEnabled | quote }}
        - name: DRONEAI_METRICS_PORT
          value: {{ .Values.dashboardApi.observability.metricsPort | quote }}
        - name: DRONEAI_SESSION_MAX_AGE_SECONDS
          value: {{ .Values.dashboardApi.auth.sessionMaxAgeSeconds | quote }}
        {{- if .Values.dashboardApi.auth.existingSecret }}
        - name: DRONEAI_API_KEYS_JSON
          valueFrom:
            secretKeyRef:
              name: {{ .Values.dashboardApi.auth.existingSecret }}
              key: {{ .Values.dashboardApi.auth.secretKey }}
              optional: true
        - name: DRONEAI_SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.dashboardApi.auth.existingSecret }}
              key: {{ .Values.dashboardApi.auth.sessionSecretKey }}
        - name: DRONEAI_CREDENTIAL_PEPPER
          valueFrom:
            secretKeyRef:
              name: {{ .Values.dashboardApi.auth.existingSecret }}
              key: {{ .Values.dashboardApi.auth.credentialPepperSecretKey }}
        {{- end }}
        - name: DRONEAI_UPLOAD_MAX_FILES
          value: {{ .Values.dashboardApi.uploads.maxFiles | quote }}
        - name: DRONEAI_UPLOAD_MAX_FILE_BYTES
          value: {{ .Values.dashboardApi.uploads.maxFileBytes | quote }}
        - name: DRONEAI_UPLOAD_MAX_BATCH_BYTES
          value: {{ .Values.dashboardApi.uploads.maxBatchBytes | quote }}
        - name: DRONEAI_ORGANIZATION_REQUEST_QUOTAS_ENABLED
          value: {{ .Values.dashboardApi.saas.organizationRequestQuotasEnabled | quote }}
        - name: DRONEAI_TILE_RATE_LIMIT_PER_MINUTE
          value: {{ .Values.dashboardApi.tiles.rateLimitPerMinute | quote }}
        - name: DRONEAI_TILE_RATE_LIMIT_BACKEND
          value: {{ .Values.dashboardApi.tiles.rateLimitBackend | quote }}
        - name: DRONEAI_TILE_RATE_LIMIT_BURST
          value: {{ .Values.dashboardApi.tiles.rateLimitBurst | quote }}
        - name: DRONEAI_TILE_RATE_LIMIT_MAX_CLIENTS
          value: {{ .Values.dashboardApi.tiles.rateLimitMaxClients | quote }}
        {{- if .Values.dashboardApi.controlWorker.enabled }}
        - name: DRONEAI_STAGE_JOBS_ENABLED
          value: {{ .Values.stageJobs.enabled | quote }}
        {{- else }}
        {{- include "drone-ai.controlEnv" . | nindent 8 }}
        {{- end }}
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: WORK_DRIVES
          value: {{ include "colmap.workDrivesJson" . | quote }}
        - name: WORK_DRIVE_DEFAULT
          value: {{ .Values.colmapWorker.workVolume.default | quote }}
        ports:
        - containerPort: 8000
        {{- if .Values.dashboardApi.observability.metricsEnabled }}
        - name: metrics
          containerPort: {{ .Values.dashboardApi.observability.metricsPort }}
        {{- end }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /live
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
        resources:
          {{- toYaml .Values.dashboardApi.resources | nindent 10 }}
      volumes:
      - name: tmp
        emptyDir: {}
---
# --- Service ---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-api-service
  namespace: {{ include "drone-ai.namespace" . }}
  labels:
    {{- include "drone-ai.labels" . | nindent 4 }}
    app: dashboard-api
spec:
  type: {{ .Values.dashboardApi.service.type }}
  selector:
    app: dashboard-api
  ports:
  - port: 8000
    targetPort: 8000
    {{- if eq .Values.dashboardApi.service.type "NodePort" }}
    nodePort: {{ .Values.dashboardApi.service.nodePort }}
    {{- end }}
