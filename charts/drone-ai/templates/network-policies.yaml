{{- if .Values.networkPolicy.enabled }}
{{- if not .Values.networkPolicy.dnsPeers }}
{{- fail "networkPolicy.dnsPeers must explicitly identify cluster resolvers" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: drone-ai-app-default-deny
  namespace: {{ include "drone-ai.namespace" . }}
  labels:
    {{- include "drone-ai.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values: [dashboard-api, dashboard-control-worker, dashboard-frontend]
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: drone-ai-stage-default-deny
  namespace: {{ include "drone-ai.namespace" . }}
  labels:
    {{- include "drone-ai.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: droneai-stage
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dashboard-frontend-allow
  namespace: {{ include "drone-ai.namespace" . }}
  labels:
    {{- include "drone-ai.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: dashboard-frontend
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace | quote }}
    ports:
    - { protocol: TCP, port: 3000 }
  egress:
  - to:
    {{- toYaml .Values.networkPolicy.dnsPeers | nindent 4 }}
    ports:
    - { protocol: UDP, port: 53 }
    - { protocol: TCP, port: 53 }
  - to:
    - podSelector:
        matchLabels:
          app: dashboard-api
    ports:
    - { protocol: TCP, port: 8000 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dashboard-api-allow
  namespace: {{ include "drone-ai.namespace" . }}
  labels:
    {{- include "drone-ai.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: dashboard-api
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace | quote }}
    - podSelector:
        matchLabels:
          app: dashboard-frontend
    ports:
    - { protocol: TCP, port: 8000 }
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace | quote }}
    ports:
    - { protocol: TCP, port: {{ .Values.dashboardApi.observability.metricsPort }} }
  egress:
  - to:
    {{- toYaml .Values.networkPolicy.dnsPeers | nindent 4 }}
    ports:
    - { protocol: UDP, port: 53 }
    - { protocol: TCP, port: 53 }
  {{- if .Values.networkPolicy.externalHttpsCidrs }}
  - to:
    {{- range .Values.networkPolicy.externalHttpsCidrs }}
    - ipBlock:
        cidr: {{ . | quote }}
    {{- end }}
    ports:
    - { protocol: TCP, port: 443 }
  {{- end }}
  {{- if .Values.networkPolicy.databasePeers }}
  - to:
    {{- toYaml .Values.networkPolicy.databasePeers | nindent 4 }}
    ports:
    - { protocol: TCP, port: {{ .Values.networkPolicy.databasePort }} }
  {{- end }}
  {{- if .Values.networkPolicy.s3Peers }}
  - to:
    {{- toYaml .Values.networkPolicy.s3Peers | nindent 4 }}
    ports:
    - { protocol: TCP, port: {{ .Values.networkPolicy.s3Port }} }
  {{- end }}
  {{- if .Values.networkPolicy.kafkaPeers }}
  - to:
    {{- toYaml .Values.networkPolicy.kafkaPeers | nindent 4 }}
    ports:
    - { protocol: TCP, port: {{ .Values.kafka.egressPort }} }
  {{- end }}
---
