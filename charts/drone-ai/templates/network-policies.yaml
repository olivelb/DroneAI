  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace | quote }}
    ports:
    - { protocol: TCP, port: {{ .Values.dashboardApi.observability.metricsPort }} }
  egress:
  - to:
    {{- toYaml .Values.networkPolicy.dnsPeers | nindent 4 }}
    ports:
    - { protocol: UDP, port: 53 }
    - { protocol: TCP, port: 53 }
  {{- if .Values.networkPolicy.externalHttpsCidrs }}
  - to:
    {{- range .Values.networkPolicy.externalHttpsCidrs }}
    - ipBlock:
        cidr: {{ . | quote }}
    {{- end }}
    ports:
    - { protocol: TCP, port: 443 }
  {{- end }}
  {{- if .Values.networkPolicy.databasePeers }}
  - to:
    {{- toYaml .Values.networkPolicy.databasePeers | nindent 4 }}
    ports:
    - { protocol: TCP, port: {{ .Values.networkPolicy.databasePort }} }
  {{- end }}
  {{- if .Values.networkPolicy.s3Peers }}
  - to:
    {{- toYaml .Values.networkPolicy.s3Peers | nindent 4 }}
    ports:
    - { protocol: TCP, port: {{ .Values.networkPolicy.s3Port }} }
  {{- end }}
  {{- if .Values.networkPolicy.kafkaPeers }}
  - to:
    {{- toYaml .Values.networkPolicy.kafkaPeers | nindent 4 }}
    ports:
    - { protocol: TCP, port: {{ .Values.kafka.egressPort }} }
  {{- end }}
  {{- if .Values.networkPolicy.kubernetesApiPeers }}
  - to:
    {{- toYaml .Values.networkPolicy.kubernetesApiPeers | nindent 4 }}
    ports:
    - { protocol: TCP, port: {{ .Values.networkPolicy.kubernetesApiPort }} }
  {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: drone-ai-stage-egress
  namespace: {{ include "drone-ai.namespace" . }}
  labels:
    {{- include "drone-ai.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: droneai-stage
  policyTypes: [Egress]
  egress:
  - to:
    {{- toYaml .Values.networkPolicy.dnsPeers | nindent 4 }}
    ports:
    - { protocol: UDP, port: 53 }
    - { protocol: TCP, port: 53 }
  {{- if .Values.networkPolicy.externalHttpsCidrs }}
  - to:
    {{- range .Values.networkPolicy.externalHttpsCidrs }}
    - ipBlock:
        cidr: {{ . | quote }}
    {{- end }}
    ports:
    - { protocol: TCP, port: 443 }
  {{- end }}
  {{- if .Values.networkPolicy.databasePeers }}
  - to:
    {{- toYaml .Values.networkPolicy.databasePeers | nindent 4 }}
    ports:
    - { protocol: TCP, port: {{ .Values.networkPolicy.databasePort }} }
  {{- end }}
  {{- if .Values.networkPolicy.s3Peers }}
  - to:
    {{- toYaml .Values.networkPolicy.s3Peers | nindent 4 }}
    ports:
    - { protocol: TCP, port: {{ .Values.networkPolicy.s3Port }} }
  {{- end }}
{{- end }}
