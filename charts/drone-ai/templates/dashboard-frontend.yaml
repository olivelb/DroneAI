apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-frontend
  namespace: {{ include "drone-ai.namespace" . }}
  labels:
    {{- include "drone-ai.labels" . | nindent 4 }}
    app: dashboard-frontend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dashboard-frontend
  template:
    metadata:
      labels:
        app: dashboard-frontend
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: frontend
        image: {{ include "drone-ai.image" (dict "root" . "image" .Values.dashboardFrontend.image "tag" .Values.dashboardFrontend.tag) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
        resources:
          {{- toYaml .Values.dashboardFrontend.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-frontend-service
  namespace: {{ include "drone-ai.namespace" . }}
  labels:
    {{- include "drone-ai.labels" . | nindent 4 }}
    app: dashboard-frontend
spec:
  type: {{ .Values.dashboardFrontend.service.type }}
  selector:
    app: dashboard-frontend
  ports:
  - port: 3000
    targetPort: 3000
    {{- if eq .Values.dashboardFrontend.service.type "NodePort" }}
    nodePort: {{ .Values.dashboardFrontend.service.nodePort }}
    {{- end }}
