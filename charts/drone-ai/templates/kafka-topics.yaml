{{- if and .Values.kafka.enabled .Values.kafka.topics }}
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics-init
  namespace: {{ include "drone-ai.namespace" . }}
  labels:
    {{- include "drone-ai.labels" . | nindent 4 }}
    app: kafka-topics-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: kafka-topics-init
    spec:
      restartPolicy: OnFailure
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kafka-topics-init
          image: {{ .Values.kafka.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["/bin/bash", "-ec"]
          args:
            - |
              broker="my-kafka.{{ include "drone-ai.namespace" . }}.svc.cluster.local:9092"
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server "${broker}" --list >/dev/null 2>&1; do
                sleep 2
              done
              {{- range .Values.kafka.topics }}
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "${broker}" \
                --create --if-not-exists --partitions 1 --replication-factor 1 \
                --topic {{ . | quote }}
              {{- end }}
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
{{- end }}
