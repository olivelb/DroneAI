{{- if and .Values.kafka.enabled .Values.kafka.topics }}
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics-init
  namespace: {{ include "drone-ai.namespace" . }}
  labels:
    {{- include "drone-ai.labels" . | nindent 4 }}
    app: kafka-topics-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: kafka-topics-init
    spec:
      restartPolicy: OnFailure
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kafka-topics-init
          image: {{ .Values.kafka.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["/bin/bash", "-ec"]
          args:
            - |
              broker="my-kafka.{{ include "drone-ai.namespace" . }}.svc.cluster.local:9092"
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server "${broker}" --list >/dev/null 2>&1; do
                sleep 2
              done
              {{- range .Values.kafka.topics }}
              {{- if lt (int .partitions) 1 }}
              {{- fail (printf "kafka topic %s must have at least one partition" .name) }}
              {{- end }}
              topic={{ .name | quote }}
              desired_partitions={{ .partitions | quote }}
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "${broker}" \
                --create --if-not-exists --partitions "${desired_partitions}" \
                --replication-factor 1 --topic "${topic}"
              current_partitions="$(
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server "${broker}" \
                  --describe --topic "${topic}" |
                  awk '/PartitionCount:/ { for (field = 1; field <= NF; field++) if ($field == "PartitionCount:") print $(field + 1) }' |
                  head -n 1
              )"
              if [[ -z "${current_partitions}" ]]; then
                echo "Unable to determine partition count for ${topic}" >&2
                exit 1
              fi
              if (( current_partitions < desired_partitions )); then
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server "${broker}" \
                  --alter --topic "${topic}" --partitions "${desired_partitions}"
              fi
              {{- end }}
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
{{- end }}
