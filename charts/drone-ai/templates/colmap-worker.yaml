apiVersion: apps/v1
kind: Deployment
metadata:
  name: colmap-worker
  namespace: {{ include "drone-ai.namespace" . }}
  labels:
    {{- include "drone-ai.labels" . | nindent 4 }}
    app: colmap
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: colmap
  template:
    metadata:
      labels:
        app: colmap
    spec:
      {{- with .Values.gpu.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gpu.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: colmap
        image: {{ include "drone-ai.image" (dict "root" . "image" .Values.colmapWorker.image "tag" .Values.colmapWorker.tag) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        env:
        {{- include "drone-ai.commonEnv" . | nindent 8 }}
        - name: QT_QPA_PLATFORM
          value: "offscreen"
        - name: WORK_DRIVES
          value: {{ include "colmap.workDrivesJson" . | quote }}
        - name: WORK_DRIVE_DEFAULT
          value: {{ .Values.colmapWorker.workVolume.default | quote }}
        - name: DRONEAI_GAUSSIAN_BACKEND
          value: {{ .Values.colmapWorker.gaussianBackend | quote }}
        volumeMounts:
        - name: work-system
          mountPath: /work/system
        {{- range .Values.colmapWorker.workVolume.drives }}
        {{- if .hostPath }}
        - name: work-{{ .name }}
          mountPath: /work/{{ .name }}
        {{- end }}
        {{- end }}
        resources:
          {{- toYaml .Values.colmapWorker.resources | nindent 10 }}
      volumes:
      - name: work-system
        emptyDir:
          sizeLimit: {{ .Values.colmapWorker.workVolume.sizeLimit }}
      {{- range .Values.colmapWorker.workVolume.drives }}
      {{- if .hostPath }}
      - name: work-{{ .name }}
        hostPath:
          path: {{ .hostPath }}
          type: DirectoryOrCreate
      {{- end }}
      {{- end }}
