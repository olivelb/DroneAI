{{- include "colmap.assertWorkDriveConfig" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: colmap-worker
  namespace: {{ include "drone-ai.namespace" . }}
  labels:
    {{- include "drone-ai.labels" . | nindent 4 }}
    app: colmap
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: colmap
  template:
    metadata:
      labels:
        app: colmap
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.gpu.runtimeClassName }}
      runtimeClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.gpu.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gpu.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
      - name: wait-for-schema
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        image: {{ include "drone-ai.image" (dict "root" . "image" .Values.dashboardApi.image "tag" .Values.dashboardApi.tag) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        command: ["/bin/sh", "-c"]
        args:
        - until cd /app && alembic current 2>/dev/null | grep -q "(head)"; do sleep 2; done
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "drone-ai.storageSecretName" . }}
              key: {{ .Values.storage.databaseUrlSecretKey }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      containers:
      - name: colmap
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        image: {{ include "drone-ai.image" (dict "root" . "image" .Values.colmapWorker.image "tag" .Values.colmapWorker.tag) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        env:
        {{- include "drone-ai.commonEnv" . | nindent 8 }}
        - name: QT_QPA_PLATFORM
          value: "offscreen"
        - name: WORK_DRIVES
          value: {{ include "colmap.workDrivesJson" . | quote }}
        - name: WORK_DRIVE_DEFAULT
          value: {{ .Values.colmapWorker.workVolume.default | quote }}
        - name: DRONEAI_GAUSSIAN_BACKEND
          value: {{ .Values.colmapWorker.gaussianBackend | quote }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        {{- range $drive := .Values.colmapWorker.workVolume.drives }}
        {{- if or (eq (default "" $drive.type) "emptyDir") (not (empty $drive.hostPath)) (not (empty $drive.existingClaim)) }}
        - name: work-{{ .name }}
          mountPath: /work/{{ .name }}
        {{- end }}
        {{- end }}
        resources:
          {{- toYaml .Values.colmapWorker.resources | nindent 10 }}
      volumes:
      - name: tmp
        emptyDir: {}
      {{- range $drive := .Values.colmapWorker.workVolume.drives }}
      {{- if or (eq (default "" $drive.type) "emptyDir") (not (empty $drive.hostPath)) (not (empty $drive.existingClaim)) }}
      - name: work-{{ .name }}
        {{- if $drive.existingClaim }}
        persistentVolumeClaim:
          claimName: {{ $drive.existingClaim | quote }}
        {{- else if $drive.hostPath }}
        hostPath:
          path: {{ $drive.hostPath | quote }}
          # The deployer must create and verify this path. Kubernetes must not
          # silently create a mount-looking path on the node root filesystem
          # when the actual disk is absent.
          type: Directory
        {{- else }}
        emptyDir:
          sizeLimit: {{ $.Values.colmapWorker.workVolume.sizeLimit }}
        {{- end }}
      {{- end }}
      {{- end }}
