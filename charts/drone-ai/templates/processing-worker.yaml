apiVersion: apps/v1
kind: Deployment
metadata:
  name: processing-worker
  namespace: {{ include "drone-ai.namespace" . }}
  labels:
    {{- include "drone-ai.labels" . | nindent 4 }}
    app: processing
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: processing
  template:
    metadata:
      labels:
        app: processing
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
      - name: wait-for-schema
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        image: {{ include "drone-ai.image" (dict "root" . "image" .Values.dashboardApi.image "tag" .Values.dashboardApi.tag) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        command: ["/bin/sh", "-c"]
        args:
        - until cd /app && alembic current 2>/dev/null | grep -q "(head)"; do sleep 2; done
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "drone-ai.storageSecretName" . }}
              key: {{ .Values.storage.databaseUrlSecretKey }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      containers:
      - name: processing
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        image: {{ include "drone-ai.image" (dict "root" . "image" .Values.processingWorker.image "tag" .Values.processingWorker.tag) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        env:
        {{- include "drone-ai.commonEnv" . | nindent 8 }}
        - name: UNTILER_DEDUPE_CENTER_THRESHOLD
          value: "40"
        - name: UNTILER_DEDUPE_IOU_THRESHOLD
          value: "0.05"
        - name: ANALYSIS_MAX_TILE_ATTEMPTS
          value: {{ .Values.processingWorker.analysis.maximumTileAttempts | quote }}
        - name: ANALYSIS_FINALIZATION_LEASE_SECONDS
          value: {{ .Values.processingWorker.analysis.finalizationLeaseSeconds | quote }}
        - name: ANALYSIS_MAX_TILE_RESULT_BYTES
          value: {{ .Values.processingWorker.analysis.maximumTileResultBytes | quote }}
        - name: ANALYSIS_MAX_AGGREGATE_RESULT_BYTES
          value: {{ .Values.processingWorker.analysis.maximumAggregateResultBytes | quote }}
        - name: ANALYSIS_MAX_RAW_DETECTIONS
          value: {{ .Values.processingWorker.analysis.maximumRawDetections | quote }}
        - name: ANALYSIS_MAX_FINAL_DETECTIONS
          value: {{ .Values.processingWorker.analysis.maximumFinalDetections | quote }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          {{- toYaml .Values.processingWorker.resources | nindent 10 }}
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: {{ .Values.processingWorker.temporaryStorage.sizeLimit }}
