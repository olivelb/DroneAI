apiVersion: apps/v1
kind: Deployment
metadata:
  name: processing-worker
  namespace: {{ include "drone-ai.namespace" . }}
  labels:
    {{- include "drone-ai.labels" . | nindent 4 }}
    app: processing
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: processing
  template:
    metadata:
      labels:
        app: processing
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
      - name: wait-for-schema
        image: {{ include "drone-ai.image" (dict "root" . "image" .Values.dashboardApi.image "tag" .Values.dashboardApi.tag) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        command: ["/bin/sh", "-c"]
        args:
        - until cd /app && alembic current 2>/dev/null | grep -q "(head)"; do sleep 2; done
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: drone-ai-storage
              key: database-url
      containers:
      - name: processing
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        image: {{ include "drone-ai.image" (dict "root" . "image" .Values.processingWorker.image "tag" .Values.processingWorker.tag) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        env:
        {{- include "drone-ai.commonEnv" . | nindent 8 }}
        - name: UNTILER_DEDUPE_CENTER_THRESHOLD
          value: "40"
        - name: UNTILER_DEDUPE_IOU_THRESHOLD
          value: "0.05"
        resources:
          {{- toYaml .Values.processingWorker.resources | nindent 10 }}
