{{- if .Values.iaWorker.enabled }}
{{- if .Values.iaWorker.modelCache.hostPath }}
# --- PersistentVolume for model cache (hostPath — local only) ---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: model-cache-pv
  labels:
    {{- include "drone-ai.labels" . | nindent 4 }}
    app: ia
spec:
  capacity:
    storage: {{ .Values.iaWorker.modelCache.size }}
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: {{ .Values.iaWorker.modelCache.hostPath }}
    type: Directory
---
{{- end }}
# --- PersistentVolumeClaim ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-cache-pvc
  namespace: {{ include "drone-ai.namespace" . }}
  labels:
    {{- include "drone-ai.labels" . | nindent 4 }}
    app: ia
spec:
  {{- if .Values.iaWorker.modelCache.hostPath }}
  storageClassName: ""
  {{- else if .Values.iaWorker.modelCache.storageClass }}
  storageClassName: {{ .Values.iaWorker.modelCache.storageClass | quote }}
  {{- end }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.iaWorker.modelCache.size }}
  {{- if .Values.iaWorker.modelCache.hostPath }}
  volumeName: model-cache-pv
  {{- end }}
---
# --- Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ia-worker
  namespace: {{ include "drone-ai.namespace" . }}
  labels:
    {{- include "drone-ai.labels" . | nindent 4 }}
    app: ia
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ia
  template:
    metadata:
      labels:
        app: ia
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.gpu.runtimeClassName }}
      runtimeClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.gpu.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gpu.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
      - name: wait-for-schema
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        image: {{ include "drone-ai.image" (dict "root" . "image" .Values.dashboardApi.image "tag" .Values.dashboardApi.tag) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        command: ["/bin/sh", "-c"]
        args:
        - until cd /app && alembic current 2>/dev/null | grep -q "(head)"; do sleep 2; done
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "drone-ai.storageSecretName" . }}
              key: {{ .Values.storage.databaseUrlSecretKey }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      containers:
      - name: ia
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        image: {{ include "drone-ai.image" (dict "root" . "image" .Values.iaWorker.image "tag" .Values.iaWorker.tag) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        env:
        {{- include "drone-ai.commonEnv" . | nindent 8 }}
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.hfToken.existingSecret }}
              key: {{ .Values.hfToken.secretKey }}
        - name: HF_HOME
          value: "/cache/huggingface"
        - name: HF_HUB_CACHE
          value: "/cache/huggingface/hub"
        - name: TRANSFORMERS_CACHE
          value: "/cache/huggingface/transformers"
        volumeMounts:
        - name: model-cache
          mountPath: /cache/huggingface
        - name: tmp
          mountPath: /tmp
        resources:
          {{- toYaml .Values.iaWorker.resources | nindent 10 }}
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: model-cache-pvc
      - name: tmp
        emptyDir: {}
{{- end }}
